                    // Backspace — single char (use overlay for destructive effect)
                    if (e.key === 'Backspace' && range.collapsed) {
                        const textBefore = editor.innerText;
                        e.preventDefault();

                        // Get the character before caret
                        const prevRange = range.cloneRange();
                        prevRange.setStart(range.startContainer, Math.max(0, range.startOffset - 1));
                        prevRange.setEnd(range.startContainer, range.startOffset);
                        const charBefore = prevRange.toString();

                        if (charBefore && charBefore !== '\n') {
                            const bounds = prevRange.getBoundingClientRect();
                            spawnOverlay(charBefore, { left: bounds.left, top: bounds.top, width: bounds.width, height: bounds.height }, deleteEffect);
                        }

                        document.execCommand('delete');
                        reportChange();
                        return;
                    }

                    // Delete — single char forward (use overlay for destructive effect)
                    if (e.key === 'Delete' && range.collapsed) {
                        const nextRange = range.cloneRange();
                        nextRange.setStart(range.startContainer, range.startOffset);
                        nextRange.setEnd(range.startContainer, range.startOffset + 1);
                        const charAfter = nextRange.toString();

                        if (charAfter && charAfter !== '\n') {
                            e.preventDefault();
                            const bounds = nextRange.getBoundingClientRect();
                            spawnOverlay(charAfter, { left: bounds.left, top: bounds.top, width: bounds.width, height: bounds.height }, deleteEffect);
                            document.execCommand('delete');
                            reportChange();
                            return;
                        }
                    }

                    // Character insert — single printable key (use inline span)
                    if (e.key.length === 1 && animEnabled) {
                        e.preventDefault();
                        insertAnimatedSpan(e.key, animEffect, { dir: pickDirection(flyInDirection), stagger: false });
                        reportChange();
                    }
                };

                // Paste handler — wrap pasted content in animated inline spans
                const handlePaste = (e) => {
                    if (!animEnabled || isComposing.current) return;
                    e.preventDefault();

                    const text = e.clipboardData.getData('text/plain');
                    if (!text) return;

                    insertAnimatedSpan(text, animEffect, { dir: pickDirection(flyInDirection), stagger: true });
                    reportChange();
                };

                const handleInput = () => {
                    if (!isComposing.current) reportChange();
                };

                editor.addEventListener('keydown', handleKeydown, true);
                editor.addEventListener('input', handleInput);
                editor.addEventListener('paste', handlePaste);

                return () => {
                    editor.removeEventListener('keydown', handleKeydown, true);
                    editor.removeEventListener('input', handleInput);
                    editor.removeEventListener('paste', handlePaste);
                };
            }, [animEnabled, animEffect, flyInDirection, deleteEffect, intensity, spawnOverlay, spawnMassEffect, reportChange, insertAnimatedSpan]);

            return (
                <div className="editor-area">
                    <div
                        ref={editorRef}
                        className="native-editor"
                        contentEditable
                        suppressContentEditableWarning
                        data-placeholder="Start typing..."
                    />
                </div>
            );
        }

        // ═══════════════════════════════════════════════
        //  TabBar
        // ═══════════════════════════════════════════════
        function TabBar({ tabs, activeId, onSelect, onClose, onAdd }) {
            return (
                <div className="tab-bar">
                    {tabs.map(tab => (
                        <div
                            key={tab.id}
                            className={'tab' + (tab.id === activeId ? ' active' : '')}
                            onClick={() => onSelect(tab.id)}
                        >
                            <div className="tab-dot" style={{ background: tab.color }} />
                            <span>{tab.name}</span>
                            <div
                                className="tab-close"
                                onClick={e => { e.stopPropagation(); onClose(tab.id); }}
                            >
                                &times;
                            </div>
                        </div>
                    ))}
                    <div className="tab" onClick={onAdd} style={{ opacity: 0.6 }}>
                        <span>+</span>
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════
        //  FloatWindow — draggable, resizable editor window
        // ═══════════════════════════════════════════════
        function FloatWindow({ tab, x, y, w, h, minimized, maximized, focused, zIndex, onFocus, onMinimize, onMaximize, onClose, onDrag, onResize, onContentChange, animDuration, animEnabled, animEffect, flyInDirection, animOffset, deleteEffect, intensity, delDuration, delIntensity, revealAtOverride }) {
            const titlebarRef = useRef(null);
            const windowRef = useRef(null);

            const onStartDrag = useCallback(e => {
                if (maximized) return;
                e.preventDefault();
                e.stopPropagation();
                onFocus();
                const el = windowRef.current;
                if (!el) return;
                const startX = e.clientX, startY = e.clientY;
                document.body.style.userSelect = 'none';

                const onMouseMove = ev => {
                    el.style.transform = `translate(${ev.clientX - startX}px, ${ev.clientY - startY}px)`;
                };
                const onMouseUp = ev => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    document.body.style.userSelect = '';
                    el.style.transform = '';
                    onDrag(ev.clientX - startX, ev.clientY - startY);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }, [maximized, onFocus, onDrag]);

            const onStartResize = useCallback(e => {
                if (maximized) return;
                e.preventDefault();
                e.stopPropagation();
                onFocus();
                const el = windowRef.current;
                if (!el) return;
                const startX = e.clientX, startY = e.clientY;
                const startW = el.offsetWidth, startH = el.offsetHeight;
                document.body.style.cursor = 'nwse-resize';
                document.body.style.userSelect = 'none';

                const onMouseMove = ev => {
                    el.style.width = Math.max(320, startW + ev.clientX - startX) + 'px';
                    el.style.height = Math.max(200, startH + ev.clientY - startY) + 'px';
                };
                const onMouseUp = ev => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    el.style.width = ''; el.style.height = '';
                    onResize(ev.clientX - startX, ev.clientY - startY);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }, [maximized, onFocus, onResize]);

            const className = ['float-window'];
            if (focused) className.push('focused');
            if (maximized) className.push('maximized');
            if (minimized) className.push('minimized');

            const style = maximized
                ? { position: 'absolute', inset: 0, zIndex }
                : { left: typeof x === 'number' ? x + 'px' : x, top: typeof y === 'number' ? y + 'px' : y, width: w, height: h, zIndex };

            return (
                <div ref={windowRef} className={className.join(' ')} style={style} onMouseDown={onFocus}>
                    <div ref={titlebarRef} className="window-titlebar" onMouseDown={onStartDrag}>
                        <div className="tab-dot" style={{ background: tab.color }} />
                        <span className="window-title">{tab.name}</span>
                        <div className="window-controls">
                            <button className="window-btn" onClick={onMinimize} title={minimized ? 'Restore' : 'Minimize'}>
                                {minimized ? '\u25A1' : '\u2014'}
                            </button>
                            <button className="window-btn" onClick={onMaximize} title={maximized ? 'Restore' : 'Maximize'}>
                                {maximized ? '\u22A1' : '\u2610'}
                            </button>
                            <button className="window-btn close-btn" onClick={onClose} title="Close">
                                &times;
                            </button>
                        </div>
                    </div>

                    {!minimized && (
                        <NativeEditor
                            key={tab.id}
                            html={tab.html}
                            onContentChange={(html, text) => onContentChange(tab.id, html, text)}
                            animDuration={animDuration}
                            animEnabled={animEnabled}
                            animEffect={animEffect}
                            flyInDirection={flyInDirection}
                            animOffset={animOffset}
                            deleteEffect={deleteEffect}
                            intensity={intensity}
                            delDuration={delDuration}
                            delIntensity={delIntensity}
                            revealAtOverride={revealAtOverride}
                        />
                    )}

                    {!maximized && (
                        <div
                            className="resize-handle"
                            style={{
                                position: 'absolute', bottom: 0, right: 0, width: 16, height: 16,
                                cursor: 'nwse-resize', zIndex: 1,
                            }}
                            onMouseDown={onStartResize}
                        />
                    )}
                </div>
            );
        }

        // ═══════════════════════════════════════════════
        //  App
        // ═══════════════════════════════════════════════
        function App() {
            const firstTabRef = useRef(createTab('Untitled'));
            const [tabs, setTabs] = useState(() => [firstTabRef.current]);
            const [activeId, setActiveId] = useState(() => firstTabRef.current.id);
            const [fileName, setFileName] = useState('Untitled');
            const [fileExt, setFileExt] = useState('.txt');
            const [isDark, setIsDark] = useState(true);
            const [animDuration, setAnimDuration] = useState(200);
            const [animOffset, setAnimOffset] = useState(18);
            const [animEnabled, setAnimEnabled] = useState(true);
            const [animEffect, setAnimEffect] = useState('flyIn');
            const [flyInDirection, setFlyInDirection] = useState('random');
            const [deleteEffect, setDeleteEffect] = useState('destroy');
            const [intensity, setIntensity] = useState(1);
            const [delDuration, setDelDuration] = useState(200);
            const [delIntensity, setDelIntensity] = useState(1);
            const [revealAtOverride, setRevealAtOverride] = useState(null);

            const workspaceRef = useRef(null);
            const [windows, setWindows] = useState(() => {
                const id = firstTabRef.current.id;
                return [{ tabId: id, x: 60, y: 30, w: 720, h: 480, minimized: false, maximized: false }];
            });
            const [nextZIndex, setNextZIndex] = useState(10);

            const focusWindow = useCallback((tabId) => {
                setWindows(prev => prev.map(w =>
                    w.tabId === tabId ? { ...w, minimized: false } : w
                ));
                setActiveId(tabId);
                setNextZIndex(z => z + 1);
            }, []);

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            }, [isDark]);

            const totalWords = useMemo(() => {
                return tabs.reduce((sum, t) => {
                    const w = t.text && t.text.trim() ? t.text.trim().split(/\s+/).length : 0;
                    return sum + w;
                }, 0);
            }, [tabs]);

            // ── Tab actions ────────────────────────────
            const handleSelect = useCallback(id => {
                setActiveId(id);
                const tab = tabs.find(t => t.id === id);
                if (tab) {
                    setFileName(tab.name.replace(/\.[^.]+$/, ''));
                    const ext = tab.name.match(/\.[^.]+$/);
                    setFileExt(ext ? ext[0] : '.txt');
                }
                focusWindow(id);
            }, [tabs, focusWindow]);

            const handleClose = useCallback(id => {
                setWindows(prev => prev.filter(w => w.tabId !== id));
                setTabs(prev => {
                    if (prev.length <= 1) return prev;
                    const idx = prev.findIndex(t => t.id === id);
                    const next = prev.filter(t => t.id !== id);
                    if (id === activeId) {
                        const newActive = next[Math.min(idx, next.length - 1)];
                        setActiveId(newActive.id);
                        setFileName(newActive.name.replace(/\.[^.]+$/, ''));
                    }
                    return next;
                });
            }, [activeId]);

            const handleAdd = useCallback(() => {
                const tab = createTab('Untitled');
                setTabs(prev => [...prev, tab]);
                setActiveId(tab.id);
                setFileName('Untitled');
                setFileExt('.txt');
                setWindows(prev => [...prev, {
                    tabId: tab.id,
                    x: 40 + (prev.length % 5) * 30, y: 20 + (prev.length % 5) * 30,
                    w: 650, h: 450, minimized: false, maximized: false,
                }]);
                setNextZIndex(z => z + 1);
            }, []);

            const toggleMinimize = useCallback((tabId) => {
                setWindows(prev => prev.map(w =>
                    w.tabId === tabId ? { ...w, minimized: !w.minimized } : w
                ));
            }, []);

            const toggleMaximize = useCallback((tabId) => {
                setWindows(prev => prev.map(w =>
                    w.tabId === tabId ? { ...w, maximized: !w.maximized } : w
                ));
            }, []);

            const closeWindow = useCallback((tabId) => handleClose(tabId), [handleClose]);

            // ── Content change ─────────────────────────
            const handleContentChange = useCallback((tabId, html, text) => {
                setTabs(prev => prev.map(t =>
                    t.id === tabId ? { ...t, html, text } : t
                ));
            }, []);

            // ── File operations ────────────────────────
            const saveFile = useCallback(() => {
                const tab = tabs.find(t => t.id === activeId);
                if (!tab) return;
                const name = fileName + fileExt;
                let content, mime;
                if (fileExt === '.json') {
                    content = JSON.stringify({ html: tab.html }, null, 2);
                    mime = 'application/json';
                } else if (fileExt === '.html' || fileExt === '.htm') {
                    content = tab.html;
                    mime = 'text/html';
                } else {
                    content = tab.text || '';
                    mime = 'text/plain';
                }
                const blob = new Blob([content], { type: mime });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name;
                a.click();
                setTabs(prev => prev.map(t =>
                    t.id === activeId ? { ...t, name } : t
                ));
            }, [tabs, activeId, fileName, fileExt]);

            const openFile = useCallback(() => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.txt,.js,.html,.css,.json,.md,.py,.ts,.jsx,.tsx';
                input.onchange = e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = ev => {
                        const text = ev.target.result;
                        let htmlContent = text;
                        if (file.name.endsWith('.json')) {
                            try { const parsed = JSON.parse(text); htmlContent = parsed.html || text; } catch {}
                        }
                        const tab = createTab(file.name, htmlContent);
                        tab.text = text;
                        setTabs(prev => [...prev, tab]);
                        setActiveId(tab.id);
                        setWindows(prev => [...prev, {
                            tabId: tab.id,
                            x: 40 + (prev.length % 5) * 30, y: 20 + (prev.length % 5) * 30,
                            w: 650, h: 450, minimized: false, maximized: false,
                        }]);
                        setFileName(file.name.replace(/\.[^.]+$/, ''));
                        const ext = file.name.match(/\.[^.]+$/);
                        setFileExt(ext ? ext[0] : '.txt');
                    };
                    reader.readAsText(file);
                };
                input.click();
            }, []);

            const renameTab = useCallback(() => {
                const name = fileName + fileExt;
                setTabs(prev => prev.map(t =>
                    t.id === activeId ? { ...t, name } : t
                ));
            }, [activeId, fileName, fileExt]);

            // ── Keyboard shortcuts ─────────────────────
            useEffect(() => {
                const handler = e => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'o') { e.preventDefault(); openFile(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); handleAdd(); }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [saveFile, openFile, handleAdd]);

            return (
                <>
                    <TabBar tabs={tabs} activeId={activeId} onSelect={handleSelect} onClose={handleClose} onAdd={handleAdd} />

                    <div className="toolbar">
                        {/* Row 1: File ops */}
                        <div className="toolbar-row">
                            <div className="toolbar-group">
                                <button onClick={handleAdd}>New</button>
                                <button onClick={openFile}>Open</button>
                                <button className="primary" onClick={saveFile}>Save</button>
                            </div>
                            <div className="toolbar-sep" />
                            <div className="toolbar-group">
                                <input type="text" value={fileName} onChange={e => setFileName(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && renameTab()} placeholder="File name" />
                                <select value={fileExt} onChange={e => setFileExt(e.target.value)}>
                                    <option value=".txt">.txt</option>
                                    <option value=".js">.js</option>
                                    <option value=".html">.html</option>
                                    <option value=".css">.css</option>
                                    <option value=".json">.json</option>
                                    <option value=".md">.md</option>
                                    <option value=".py">.py</option>
                                </select>
                                <button onClick={renameTab}>Rename</button>
                            </div>
                        </div>

                        {/* Row 2: FX toggle, Effect type, Direction */}
                        <div className="toolbar-row">
                            <div className="toolbar-group">
                                <button onClick={() => setAnimEnabled(prev => !prev)}
                                    style={{
                                        background: animEnabled ? 'var(--accent)' : 'var(--bg-surface-alt)',
                                        color: animEnabled ? '#fff' : 'var(--text-muted)', fontWeight: 600,
                                    }} title="Toggle letter animation">
                                    {animEnabled ? 'FX ON' : 'FX OFF'}
                                </button>
                            </div>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Effect</label>
                                <select value={animEffect} onChange={e => setAnimEffect(e.target.value)} disabled={!animEnabled}
                                    style={{fontSize: '12px', background: 'var(--bg-surface-alt)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: '4px', padding: '2px 4px'}}>
                                    <option value="flyIn">Fly In</option>
                                    <option value="digitize">Digitize</option>
                                    <option value="pop">Pop</option>
                                    <option value="slam">Slam</option>
                                    <option value="spin">Spin</option>
                                    <option value="wave">Wave</option>
                                    <option value="typewriter">Typewriter</option>
                                    <option value="glitch">Glitch</option>
                                    <option value="inkBlot">Ink Blot</option>
                                    <option value="magnetic">Magnetic</option>
                                    <option value="xirtam">XIRTAM</option>
                                </select>
                            </div>
                            {animEffect === 'flyIn' && (
                                <div className="toolbar-group">
                                    <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Direction</label>
                                    <select value={flyInDirection} onChange={e => setFlyInDirection(e.target.value)} disabled={!animEnabled}
                                        style={{fontSize: '12px', background: 'var(--bg-surface-alt)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: '4px', padding: '2px 4px'}}>
                                        <option value="random">Random</option>
                                        <option value="top">Top</option>
                                        <option value="bottom">Bottom</option>
                                        <option value="left">Left</option>
                                        <option value="right">Right</option>
                                        <option value="diagonal">Diagonal</option>
                                    </select>
                                </div>
                            )}
                        </div>

                        {/* Row 3: Generative settings */}
                        <div className="toolbar-row">
                            <label style={{fontSize: '11px', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.5px'}}>Generative</label>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Speed</label>
                                <input type="number" min={50} max={10000} step={10} value={animDuration}
                                    onChange={e => setAnimDuration(Number(e.target.value))} disabled={!animEnabled} style={{width: '70px'}} />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '35px'}}>{animDuration}ms</span>
                            </div>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Size</label>
                                <input type="number" min={0} max={1000} step={1} value={animOffset}
                                    onChange={e => setAnimOffset(Number(e.target.value))} disabled={!animEnabled} style={{width: '60px'}} />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '20px'}}>{animOffset}</span>
                            </div>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Intensity</label>
                                <input type="number" min={0} max={10} step={0.05} value={intensity.toFixed(2)}
                                    onChange={e => setIntensity(parseFloat(e.target.value))} disabled={!animEnabled} style={{width: '65px'}} />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '35px'}}>{intensity.toFixed(2)}x</span>
                            </div>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Reveal At</label>
                                <input type="number" min={0} max={100} step={5} value={revealAtOverride !== null ? revealAtOverride : EFFECTS[animEffect]?.revealAt ?? 70}
                                    onChange={e => setRevealAtOverride(Math.min(100, Math.max(0, Number(e.target.value))))} disabled={!animEnabled} style={{width: '55px'}} />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '25px'}}>%</span>
                            </div>
                        </div>

                        {/* Row 4: Delete FX */}
                        <div className="toolbar-row">
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Delete FX</label>
                                <select value={deleteEffect} onChange={e => setDeleteEffect(e.target.value)} disabled={!animEnabled}
                                    style={{fontSize: '12px', background: 'var(--bg-surface-alt)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: '4px', padding: '2px 4px'}}>
                                    <option value="destroy">Explode</option>
                                    <option value="evaporate">Evaporate</option>
                                    <option value="cut">Slice</option>
                                    <option value="shatter">Shatter</option>
                                    <option value="confetti">Confetti</option>
                                    <option value="blackHole">Black Hole</option>
                                </select>
                            </div>
                        </div>

                        {/* Row 5: Destructive settings */}
                        <div className="toolbar-row">
                            <label style={{fontSize: '11px', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.5px'}}>Destructive</label>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Speed</label>
                                <input type="number" min={50} max={10000} step={10} value={delDuration}
                                    onChange={e => setDelDuration(Number(e.target.value))} disabled={!animEnabled} style={{width: '70px'}} />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '35px'}}>{delDuration}ms</span>
                            </div>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Intensity</label>
                                <input type="number" min={0} max={10} step={0.05} value={delIntensity.toFixed(2)}
                                    onChange={e => setDelIntensity(parseFloat(e.target.value))} disabled={!animEnabled} style={{width: '65px'}} />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '35px'}}>{delIntensity.toFixed(2)}x</span>
                            </div>
                        </div>

                        {/* Row 6: Theme */}
                        <div className="toolbar-row">
                            <div className="toolbar-sep" />
                            <div className="toolbar-group">
                                <button onClick={() => setIsDark(d => !d)}>{isDark ? 'Dark' : 'Light'}</button>
                            </div>
                        </div>
                    </div>

                    <div ref={workspaceRef} className="workspace-area">
                        {windows.length === 0 && (
                            <div className="workspace-empty">No open documents &middot; Click New or Open to start</div>
                        )}
                        {windows.map(win => {
                            const tab = tabs.find(t => t.id === win.tabId);
                            if (!tab) return null;
                            const isFocused = activeId === win.tabId;
                            const zIdx = isFocused ? nextZIndex : 10;

                            return (
                                <FloatWindow
                                    key={win.tabId}
                                    tab={tab}
                                    x={win.x} y={win.y} w={win.w} h={win.h}
                                    minimized={win.minimized} maximized={win.maximized}
                                    focused={isFocused}
                                    zIndex={zIdx}
                                    onFocus={() => focusWindow(win.tabId)}
                                    onMinimize={() => toggleMinimize(win.tabId)}
                                    onMaximize={() => toggleMaximize(win.tabId)}
                                    onClose={() => closeWindow(win.tabId)}
                                    onDrag={(dx, dy) => {
                                        setWindows(prev => prev.map(w =>
                                            w.tabId === win.tabId ? { ...w, x: w.x + dx, y: w.y + dy } : w
                                        ));
                                    }}
                                    onResize={(dw, dh) => {
                                        setWindows(prev => prev.map(w => {
                                            if (w.tabId !== win.tabId) return w;
                                            return { ...w, w: Math.max(320, Number(w.w) + dw), h: Math.max(200, Number(w.h) + dh) };
                                        }));
                                    }}
                                    onContentChange={handleContentChange}
                                    animDuration={animDuration}
                                    animEnabled={animEnabled}
                                    animEffect={animEffect}
                                    flyInDirection={flyInDirection}
                                    animOffset={animOffset}
                                    deleteEffect={deleteEffect}
                                    intensity={intensity}
                                    delDuration={delDuration}
                                    delIntensity={delIntensity}
                                    revealAtOverride={revealAtOverride}
                                />
                            );
                        })}
                    </div>

                    <div className="status-bar">
                        <span>{windows.length} window{windows.length > 1 ? 's' : ''} &middot; {tabs.length} tab{tabs.length > 1 ? 's' : ''}</span>
                        <span>{totalWords} words total</span>
                        <span>Ctrl+S save &middot; Ctrl+O open &middot; Ctrl+N new</span>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
