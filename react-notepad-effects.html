<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Notepad Effects</title>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-app: #f5f5f5;
            --bg-surface: #ffffff;
            --bg-surface-alt: #f0f0f0;
            --bg-elevated: #e8e8e8;
            --border: #d0d0d0;
            --border-focus: #4a90d9;
            --text: #222;
            --text-muted: #888;
            --accent: #4a90d9;
            --accent-rgb: 74, 144, 217;
            --accent-hover: #357abd;
            --danger: #e74c3c;
            --editor-bg: #ffffff;
            --editor-text: #222;
            --code-bg: #f4f4f4;
            --scrollbar-thumb: #ccc;
            --scrollbar-track: transparent;
            --tab-active-border: #4a90d9;
            --toolbar-bg: #f8f8f8;
            --toolbar-border: #e0e0e0;
            --split-handle: #ddd;
            --split-handle-hover: #bbb;
        }

        [data-theme="dark"] {
            --bg-app: #111;
            --bg-surface: #1a1a1a;
            --bg-surface-alt: #242424;
            --bg-elevated: #2a2a2a;
            --border: #333;
            --border-focus: #e94560;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #e94560;
            --accent-rgb: 233, 69, 96;
            --accent-hover: #c73e54;
            --danger: #ff6b6b;
            --editor-bg: #1a1a1a;
            --editor-text: #d4d4d4;
            --code-bg: #252525;
            --scrollbar-thumb: #444;
            --scrollbar-track: transparent;
            --tab-active-border: #e94560;
            --toolbar-bg: #1a1a1a;
            --toolbar-border: #333;
            --split-handle: #333;
            --split-handle-hover: #555;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-app);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
        }

        #root {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ── Scrollbar ──────────────────────────────── */
        *::-webkit-scrollbar { width: 8px; height: 8px; }
        *::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        *::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
        *::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ── Tab Bar ─────────────────────────────────── */
        .tab-bar {
            display: flex;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            flex-shrink: 0;
        }

        .tab-bar::-webkit-scrollbar { height: 3px; }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
            color: var(--text-muted);
            transition: background 0.15s, color 0.15s;
            user-select: none;
            flex-shrink: 0;
        }

        .tab:hover { background: var(--bg-surface-alt); color: var(--text); }
        .tab.active {
            background: var(--bg-elevated);
            color: var(--text);
            border-bottom: 2px solid var(--tab-active-border);
        }

        .tab-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tab-close {
            width: 18px; height: 18px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-muted);
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .tab:hover .tab-close { background: rgba(128,128,128,0.15); }
        .tab-close:hover { background: var(--danger) !important; color: #fff !important; }

        /* ── Toolbar ─────────────────────────────────── */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        .toolbar input[type="text"] {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
            width: 140px;
            outline: none;
        }

        .toolbar input[type="text"]:focus { border-color: var(--border-focus); }

        .toolbar select {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        .toolbar button {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .toolbar button:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .toolbar button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .toolbar button.primary:hover { background: var(--accent-hover); }

        /* ── Workspace Area ─────────────────────────── */
        .workspace-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-app);
            background-image:
                radial-gradient(circle at 1px 1px, var(--border) 0.5px, transparent 0);
            background-size: 24px 24px;
        }

        .workspace-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        /* ── Floating Window ─────────────────────────── */
        .float-window {
            position: absolute;
            display: flex;
            flex-direction: column;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25), 0 1px 4px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            min-width: 320px;
            min-height: 200px;
        }

        .float-window.focused {
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.2);
            border-color: var(--accent);
        }

        .float-window.maximized {
            border-radius: 0;
            box-shadow: none;
        }

        .float-window.minimized {
            overflow: hidden;
        }

        /* ── Window Title Bar (drag handle) ─────────── */
        .window-titlebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: var(--bg-surface-alt);
            border-bottom: 1px solid var(--border);
            cursor: move;
            user-select: none;
            flex-shrink: 0;
        }

        .window-titlebar:hover {
            background: var(--bg-elevated);
        }

        .window-titlebar .tab-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .window-titlebar .window-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .window-controls {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }

        .window-btn {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border: none;
            background: transparent;
            padding: 0;
        }

        .window-btn:hover {
            background: rgba(128, 128, 128, 0.2);
            color: var(--text);
        }

        .window-btn.close-btn:hover {
            background: var(--danger) !important;
            color: #fff !important;
        }

        /* ── Editor Area ─────────────────────────────── */
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--editor-bg);
            transition: background 0.2s;
            position: relative;
        }

        .native-editor {
            flex: 1;
            padding: 24px 32px 80px 32px;
            font-size: 15px;
            line-height: 1.7;
            color: var(--editor-text);
            background: var(--editor-bg);
            outline: none;
            overflow-y: auto;
            transition: color 0.2s, background 0.2s;
        }

        .native-editor:empty::before {
            content: attr(data-placeholder);
            color: var(--text-muted);
            opacity: 0.6;
        }

        .native-editor h1 { font-size: 2em; margin: 0.5em 0; }
        .native-editor h2 { font-size: 1.5em; margin: 0.4em 0; }
        .native-editor h3 { font-size: 1.25em; margin: 0.3em 0; }

        .native-editor pre {
            background: var(--code-bg);
            border-radius: 4px;
            padding: 12px 16px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.5;
            overflow-x: auto;
        }

        .native-editor blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 16px;
            margin: 12px 0;
            color: var(--text-muted);
            font-style: italic;
        }

        .native-editor a { color: var(--accent); }

        .native-editor code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 0.9em;
        }

        /* ── Char insert animation ───────────────────── */
        :root {
            --char-anim-duration: 200ms;
            --char-anim-offset: -18px;
            --char-anim-scale: 1.4;
            --reveal-at: 70%;
        }

        /* ── Inline animated spans (inline with text flow) ─── */
        .char-inline {
            display: inline-block;
            opacity: 0;
            transform-origin: center center;
            will-change: transform, opacity, filter;
        }

        @keyframes char-inline-flyIn {
            0%   { opacity: 0; transform: translateY(var(--char-anim-offset)) translateX(var(--char-anim-drift-x, 0px)) scale(var(--char-anim-scale)); }
            var(--reveal-at) { opacity: 1; }
            80%  { opacity: 1; transform: translateY(-2px) translateX(0) scale(1); }
            100% { opacity: 1; transform: none; }
        }

        @keyframes char-inline-digitize {
            0%   { opacity: 0; filter: blur(var(--char-b1, 6px)) contrast(2) brightness(2); transform: scale(var(--char-s1, 1.3)); }
            var(--reveal-at) { opacity: 1; filter: blur(0) contrast(1) brightness(1); }
            100% { opacity: 1; filter: none; transform: none; }
        }

        @keyframes char-inline-pop {
            0%   { opacity: 0; transform: scale(0.2); }
            var(--reveal-at) { opacity: 1; }
            55%  { opacity: 1; transform: scale(var(--char-s1, 1.18)); }
            78%  { opacity: 1; transform: scale(var(--char-s2, 0.94)); }
            100% { opacity: 1; transform: none; }
        }

        @keyframes char-inline-slam {
            0%   { opacity: 0; transform: translateY(var(--char-d1, -30px)) scale(var(--char-s1, 1.2)); }
            var(--reveal-at) { opacity: 1; }
            55%  { opacity: 1; transform: translateY(var(--char-d2, 3px)) scale(1); }
            75%  { opacity: 1; transform: translateY(var(--char-d3, -1px)) scale(1); }
            100% { opacity: 1; transform: none; }
        }

        @keyframes char-inline-spin {
            0%   { opacity: 0; transform: perspective(420px) rotateY(var(--char-spin-y0, -100deg)) rotateZ(var(--char-spin-z0, -360deg)) scale(var(--char-s1, 0.35)); }
            var(--reveal-at) { opacity: 1; }
            82%  { opacity: 1; transform: perspective(420px) rotateY(0deg) rotateZ(0deg) scale(1); }
            100% { opacity: 1; transform: none; }
        }

        @keyframes char-inline-wave {
            0%   { opacity: 0; transform: translateY(var(--char-d1, 7px)) scale(var(--char-s1, 0.85)); }
            var(--reveal-at) { opacity: 1; }
            30%  { opacity: 1; transform: translateY(var(--char-d2, -5px)) scale(var(--char-s2, 1.05)); }
            55%  { opacity: 1; transform: translateY(var(--char-d3, 2px)) scale(1); }
            80%  { opacity: 1; transform: translateY(var(--char-d4, -1px)) scale(1); }
            100% { opacity: 1; transform: none; }
        }

        @keyframes char-inline-typewriter {
            0%   { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(var(--char-d1, -6px)); }
            var(--reveal-at) { opacity: 1; clip-path: inset(0 0 0 0); }
            55%  { opacity: 1; clip-path: inset(0 0 0 0); transform: none; }
            100% { opacity: 1; clip-path: inset(0 0 0 0); transform: none; }
        }

        @keyframes char-inline-glitch {
            0%   { opacity: 0; transform: translate(var(--char-d1, -4px), var(--char-d2, 2px)) skewX(var(--char-r1, -8deg)); text-shadow: calc(var(--char-gx, 3px) * -1) 0 #ff0040, var(--char-gx, 3px) 0 #00e5ff; filter: contrast(1.4); }
            var(--reveal-at) { opacity: 1; text-shadow: none; filter: none; }
            70%  { opacity: 1; transform: translate(0, 0) skewX(0deg); text-shadow: none; filter: contrast(1); }
            100% { opacity: 1; transform: none; text-shadow: none; }
        }

        @keyframes char-inline-inkBlot {
            0%   { opacity: 0; filter: blur(var(--char-b1, 5px)); transform: scale(var(--char-s1, 1.8)) rotate(var(--char-r1, -8deg)); }
            var(--reveal-at) { opacity: 1; filter: none; }
            75%  { opacity: 1; filter: blur(0.5px); transform: scale(0.97) rotate(0deg); }
            100% { opacity: 1; filter: none; transform: none; }
        }

        @keyframes char-inline-magnetic {
            0%   { opacity: 0; transform: translate(var(--char-d1, -24px), var(--char-d2, 18px)) scale(var(--char-s1, 0.5)) rotate(var(--char-r1, -25deg)); }
            var(--reveal-at) { opacity: 1; }
            82%  { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { opacity: 1; transform: none; }
        }

        @keyframes char-inline-xirtam {
            0%   { opacity: 0; color: #33ff66; text-shadow: 0 0 8px #00ff55, 0 0 16px #00aa33; transform: translateY(var(--char-d1, -28px)) scale(var(--char-s1, 1.15)); filter: brightness(1.6); }
            var(--reveal-at) { opacity: 1; color: inherit; text-shadow: none; filter: none; }
            70%  { opacity: 1; color: inherit; text-shadow: none; transform: translateY(0) scale(1); filter: brightness(1); }
            100% { opacity: 1; transform: none; }
        }

        .char-inline.flyIn    { animation: char-inline-flyIn var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .char-inline.digitize { animation: char-inline-digitize var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .char-inline.pop      { animation: char-inline-pop var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .char-inline.slam     { animation: char-inline-slam var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .char-inline.spin     { transform-style: preserve-3d; backface-visibility: visible; animation: char-inline-spin var(--char-anim-duration) cubic-bezier(0.2, 0.85, 0.25, 1) forwards; }
        .char-inline.wave     { animation: char-inline-wave var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .char-inline.typewriter { animation: char-inline-typewriter var(--char-anim-duration) steps(6, end) forwards; }
        .char-inline.glitch   { animation: char-inline-glitch var(--char-anim-duration) steps(5, end) forwards; }
        .char-inline.inkBlot  { animation: char-inline-inkBlot var(--char-anim-duration) cubic-bezier(0.34, 1.2, 0.64, 1) forwards; }
        .char-inline.magnetic { animation: char-inline-magnetic var(--char-anim-duration) cubic-bezier(0.18, 0.9, 0.2, 1.15) forwards; }
        .char-inline.xirtam   { animation: char-inline-xirtam var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        /* ── Fly-in (top default) ──────────────────── */
        @keyframes char-flyIn {
            0% {
                opacity: 0;
                transform: translateY(var(--char-anim-offset)) translateX(var(--char-anim-drift-x, 0px)) scale(var(--char-anim-scale));
            }
            60% { opacity: 0.9; }
            80% {
                opacity: 1;
                transform: translateY(-2px) translateX(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(0) translateX(0) scale(1);
            }
        }

        /* ── Digitize: pixelate into place ────────── */
        @keyframes char-digitize {
            0% {
                opacity: 0;
                filter: blur(var(--char-b1, 6px)) contrast(2) brightness(2);
                transform: scale(var(--char-s1, 1.3));
            }
            30% {
                opacity: 0.6;
                filter: blur(var(--char-b2, 3px)) contrast(1.5) brightness(1.3);
                transform: scale(var(--char-s2, 1.1));
            }
            60% {
                opacity: 0.9;
                filter: blur(var(--char-b3, 1px)) contrast(1.1) brightness(1.05);
                transform: scale(var(--char-s3, 1.02));
            }
            80% {
                opacity: 1;
                filter: blur(0) contrast(1) brightness(1);
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(1);
                filter: blur(0);
            }
        }

        .char-animate {
            display: block;
            position: absolute;
            pointer-events: none;
            z-index: 9999;
            white-space: pre;
            transform-origin: center center;
            will-change: transform, opacity, filter;
        }
        .char-animate.flyIn {
            animation: char-flyIn var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .char-animate.digitize {
            animation: char-digitize var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ── Destruction: red glow → explode outward ─────── */
        @keyframes char-destroy {
            0% {
                opacity: 1;
                color: var(--text);
                text-shadow: none;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            18% {
                opacity: 1;
                color: #ff4444;
                text-shadow: 0 0 6px #ff0000, 0 0 12px #ff4444;
                transform: translate(0, 0) scale(var(--char-s1, 1.15)) rotate(0deg);
            }
            40% {
                opacity: 0.95;
                color: #ff6600;
                text-shadow: 0 0 10px #ff0000, 0 0 20px #ff4444, 0 0 30px #ff2200;
                transform:
                    translate(calc(var(--char-dx, 0px) * 0.25), calc(var(--char-dy, 0px) * 0.2))
                    scale(var(--char-s2, 1.35))
                    rotate(calc(var(--char-r1, 20deg) * 0.4));
            }
            70% {
                opacity: 0.55;
                color: #ffaa00;
                text-shadow: 0 0 14px #ff4400, 0 0 28px #ff6600;
                transform:
                    translate(calc(var(--char-dx, 0px) * 0.7), calc(var(--char-dy, 0px) * 0.75))
                    scale(var(--char-s3, 1.1))
                    rotate(calc(var(--char-r1, 20deg) * 0.85));
            }
            100% {
                opacity: 0;
                color: #ffcc66;
                text-shadow: 0 0 18px #ff4400, 0 0 36px #ff0000;
                transform:
                    translate(var(--char-dx, 0px), var(--char-dy, 0px))
                    scale(var(--char-s4, 0.55))
                    rotate(var(--char-r2, 120deg));
            }
        }

        .char-animate.destroy {
            animation: char-destroy var(--char-anim-duration) cubic-bezier(0.15, 0.85, 0.25, 1) forwards;
        }

        /* ── Debris shard (mass delete building-collapse) ── */
        @keyframes char-debris {
            0% {
                opacity: 1;
                filter: brightness(1);
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            12% {
                opacity: 1;
                filter: brightness(1.8);
                transform:
                    translate(calc(var(--char-dx, 0px) * 0.08), calc(var(--char-dy, 0px) * 0.05))
                    rotate(calc(var(--char-r1, 0deg) * 0.15))
                    scale(var(--char-s1, 1.2));
            }
            55% {
                opacity: 0.85;
                filter: brightness(1.15);
                transform:
                    translate(calc(var(--char-dx, 0px) * 0.65), calc(var(--char-dy, 0px) * 0.55))
                    rotate(calc(var(--char-r1, 0deg) * 0.7))
                    scale(var(--char-s2, 0.95));
            }
            100% {
                opacity: 0;
                filter: brightness(0.7);
                transform:
                    translate(var(--char-dx, 0px), calc(var(--char-dy, 0px) + var(--char-fall, 40px)))
                    rotate(var(--char-r2, 180deg))
                    scale(var(--char-s3, 0.35));
            }
        }
        .char-animate.debris {
            animation: char-debris var(--char-anim-duration) cubic-bezier(0.12, 0.7, 0.25, 1) forwards;
        }

        /* ── Pop: elastic overshoot ────────────────── */
        @keyframes char-pop {
            0% { opacity: 0; transform: scale(0.2); }
            55% { opacity: 1; transform: scale(var(--char-s1, 1.18)); }
            78% { opacity: 1; transform: scale(var(--char-s2, 0.94)); }
            100% { opacity: 0; transform: scale(1); }
        }
        .char-animate.pop {
            animation: char-pop var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ── Slam: heavy drop with a tiny bounce ───── */
        @keyframes char-slam {
            0% { opacity: 0; transform: translateY(var(--char-d1, -30px)) scale(var(--char-s1, 1.2)); }
            55% { opacity: 1; transform: translateY(var(--char-d2, 3px)) scale(1); }
            75% { opacity: 1; transform: translateY(var(--char-d3, -1px)) scale(1); }
            100% { opacity: 0; transform: translateY(0) scale(1); }
        }
        .char-animate.slam {
            animation: char-slam var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ── Spin: full Z-spin + 3D Y-flip into place ─── */
        @keyframes char-spin {
            0% {
                opacity: 0;
                transform:
                    perspective(420px)
                    rotateY(var(--char-spin-y0, -100deg))
                    rotateZ(var(--char-spin-z0, -360deg))
                    scale(var(--char-s1, 0.35));
            }
            55% {
                opacity: 1;
                transform:
                    perspective(420px)
                    rotateY(var(--char-spin-y1, 18deg))
                    rotateZ(var(--char-spin-z1, 28deg))
                    scale(var(--char-s2, 1.12));
            }
            82% {
                opacity: 1;
                transform:
                    perspective(420px)
                    rotateY(0deg)
                    rotateZ(0deg)
                    scale(1);
            }
            100% {
                opacity: 0;
                transform:
                    perspective(420px)
                    rotateY(0deg)
                    rotateZ(0deg)
                    scale(1);
            }
        }
        .char-animate.spin {
            transform-style: preserve-3d;
            backface-visibility: visible;
            animation: char-spin var(--char-anim-duration) cubic-bezier(0.2, 0.85, 0.25, 1) forwards;
        }

        /* ── Wave: ripple settle ───────────────────── */
        @keyframes char-wave {
            0% { opacity: 0; transform: translateY(var(--char-d1, 7px)) scale(var(--char-s1, 0.85)); }
            30% { opacity: 1; transform: translateY(var(--char-d2, -5px)) scale(var(--char-s2, 1.05)); }
            55% { opacity: 1; transform: translateY(var(--char-d3, 2px)) scale(1); }
            80% { opacity: 1; transform: translateY(var(--char-d4, -1px)) scale(1); }
            100% { opacity: 0; transform: translateY(0) scale(1); }
        }
        .char-animate.wave {
            animation: char-wave var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ── Evaporate: steam away upward ──────────── */
        @keyframes char-evaporate {
            0% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
            35% { opacity: 0.85; transform: translateY(var(--char-d1, -10px)) scale(var(--char-s1, 1.05)); filter: blur(var(--char-b1, 1px)); }
            70% { opacity: 0.45; transform: translateY(var(--char-d2, -22px)) scale(var(--char-s2, 1.12)); filter: blur(var(--char-b2, 2px)); }
            100% { opacity: 0; transform: translateY(var(--char-d3, -34px)) scale(var(--char-s3, 1.2)); filter: blur(var(--char-b3, 5px)); }
        }
        .char-animate.evaporate {
            animation: char-evaporate var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ── Cut: letter sliced into two halves ────── */
        @keyframes char-cut {
            0% { opacity: 1; transform: translateY(0) rotate(0); }
            40% { opacity: 1; transform: translateY(var(--char-d1, 8px)) rotate(var(--char-r1, 6deg)); }
            100% { opacity: 0; transform: translateY(var(--char-d2, 28px)) rotate(var(--char-r2, 16deg)); }
        }
        .char-animate.cut {
            animation: char-cut var(--char-anim-duration) linear forwards;
        }

        /* ── Typewriter: wipe + strike underline ──── */
        @keyframes char-typewriter {
            0% {
                opacity: 0;
                clip-path: inset(0 100% 0 0);
                transform: translateX(var(--char-d1, -6px));
            }
            55% {
                opacity: 1;
                clip-path: inset(0 0 0 0);
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                clip-path: inset(0 0 0 0);
                transform: translateX(0);
            }
        }
        .char-animate.typewriter {
            animation: char-typewriter var(--char-anim-duration) steps(6, end) forwards;
        }
        @keyframes char-typewriter-bar {
            0% { opacity: 0; transform: scaleX(0.2); }
            25% { opacity: 1; transform: scaleX(1); }
            70% { opacity: 0.85; transform: scaleX(1); }
            100% { opacity: 0; transform: scaleX(0.4); }
        }
        .char-typewriter-bar {
            position: absolute;
            pointer-events: none;
            z-index: 9998;
            height: 2px;
            border-radius: 1px;
            transform-origin: left center;
            animation: char-typewriter-bar var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ── Glitch: RGB split + jitter ────────────── */
        @keyframes char-glitch {
            0% {
                opacity: 0;
                transform: translate(var(--char-d1, -4px), var(--char-d2, 2px)) skewX(var(--char-r1, -8deg));
                text-shadow:
                    calc(var(--char-gx, 3px) * -1) 0 #ff0040,
                    var(--char-gx, 3px) 0 #00e5ff;
                filter: contrast(1.4);
            }
            20% {
                opacity: 1;
                transform: translate(var(--char-d3, 3px), var(--char-d4, -2px)) skewX(var(--char-r2, 6deg));
                text-shadow:
                    var(--char-gx, 3px) 0 #ff0040,
                    calc(var(--char-gx, 3px) * -1) 0 #00e5ff;
            }
            45% {
                opacity: 1;
                transform: translate(var(--char-d5, -2px), 0) skewX(0deg);
                text-shadow:
                    calc(var(--char-gx, 3px) * -0.5) 0 #ff0040,
                    calc(var(--char-gx, 3px) * 0.5) 0 #00e5ff;
            }
            70% {
                opacity: 1;
                transform: translate(0, 0) skewX(0deg);
                text-shadow: none;
                filter: contrast(1);
            }
            100% {
                opacity: 0;
                transform: translate(0, 0);
                text-shadow: none;
            }
        }
        .char-animate.glitch {
            animation: char-glitch var(--char-anim-duration) steps(5, end) forwards;
        }

        /* ── Ink blot: blob settle ─────────────────── */
        @keyframes char-inkBlot {
            0% {
                opacity: 0;
                filter: blur(var(--char-b1, 5px));
                transform: scale(var(--char-s1, 1.8)) rotate(var(--char-r1, -8deg));
            }
            40% {
                opacity: 0.85;
                filter: blur(var(--char-b2, 2px));
                transform: scale(var(--char-s2, 1.15)) rotate(var(--char-r2, 3deg));
            }
            75% {
                opacity: 1;
                filter: blur(0.5px);
                transform: scale(0.97) rotate(0deg);
            }
            100% {
                opacity: 0;
                filter: blur(0);
                transform: scale(1) rotate(0deg);
            }
        }
        .char-animate.inkBlot {
            animation: char-inkBlot var(--char-anim-duration) cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
        }

        /* ── Magnetic: arc into place from caret ───── */
        @keyframes char-magnetic {
            0% {
                opacity: 0;
                transform:
                    translate(var(--char-d1, -24px), var(--char-d2, 18px))
                    scale(var(--char-s1, 0.5))
                    rotate(var(--char-r1, -25deg));
            }
            55% {
                opacity: 1;
                transform:
                    translate(var(--char-d3, 4px), var(--char-d4, -6px))
                    scale(var(--char-s2, 1.08))
                    rotate(var(--char-r2, 8deg));
            }
            82% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
        }
        .char-animate.magnetic {
            animation: char-magnetic var(--char-anim-duration) cubic-bezier(0.18, 0.9, 0.2, 1.15) forwards;
        }

        /* ── XIRTAM: Matrix-style ASCII decode into place ─── */
        @keyframes char-xirtam {
            0% {
                opacity: 0;
                color: #33ff66;
                text-shadow: 0 0 8px #00ff55, 0 0 16px #00aa33;
                transform: translateY(var(--char-d1, -28px)) scale(var(--char-s1, 1.15));
                filter: brightness(1.6);
            }
            35% {
                opacity: 1;
                color: #66ff99;
                text-shadow: 0 0 6px #00ff55;
                transform: translateY(var(--char-d2, -8px)) scale(1);
            }
            70% {
                opacity: 1;
                color: inherit;
                text-shadow: none;
                transform: translateY(0) scale(1);
                filter: brightness(1);
            }
            100% {
                opacity: 0;
                transform: translateY(0) scale(1);
            }
        }
        .char-animate.xirtam {
            animation: char-xirtam var(--char-anim-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes char-xirtam-trail {
            0% { opacity: 0.7; transform: translateY(0) scale(0.9); filter: blur(0); }
            100% { opacity: 0; transform: translateY(var(--char-d1, 18px)) scale(0.7); filter: blur(2px); }
        }
        .char-animate.xirtam-trail {
            color: #22cc55 !important;
            text-shadow: 0 0 6px #00ff55;
            animation: char-xirtam-trail calc(var(--char-anim-duration) * 0.85) linear forwards;
        }

        /* ── Shatter: multi-shard tumble ───────────── */
        @keyframes char-shatter {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            15% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(var(--char-s1, 1.08));
                filter: brightness(1.4);
            }
            100% {
                opacity: 0;
                transform:
                    translate(var(--char-dx, 20px), var(--char-dy, 30px))
                    rotate(var(--char-r1, 40deg))
                    scale(var(--char-s2, 0.7));
                filter: brightness(0.8);
            }
        }
        .char-animate.shatter {
            animation: char-shatter var(--char-anim-duration) cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
        }

        /* ── Confetti: colorful flutter fall ───────── */
        @keyframes char-confetti {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            25% {
                opacity: 1;
                transform:
                    translate(calc(var(--char-dx, 10px) * 0.3), calc(var(--char-dy, 20px) * 0.15))
                    rotate(calc(var(--char-r1, 90deg) * 0.3))
                    scale(var(--char-s1, 1.15));
            }
            60% {
                opacity: 0.9;
                transform:
                    translate(calc(var(--char-dx, 10px) * 0.75), calc(var(--char-dy, 20px) * 0.55))
                    rotate(calc(var(--char-r1, 90deg) * 0.7))
                    scale(1);
            }
            100% {
                opacity: 0;
                transform:
                    translate(var(--char-dx, 10px), var(--char-dy, 40px))
                    rotate(var(--char-r2, 200deg))
                    scale(var(--char-s2, 0.6));
            }
        }
        .char-animate.confetti {
            animation: char-confetti var(--char-anim-duration) cubic-bezier(0.25, 0.6, 0.35, 1) forwards;
        }

        /* ── Black hole: spiral into caret ─────────── */
        @keyframes char-blackHole {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1);
                filter: brightness(1);
            }
            40% {
                opacity: 0.95;
                transform:
                    translate(calc(var(--char-dx, -12px) * 0.35), calc(var(--char-dy, 0px) * 0.35))
                    rotate(var(--char-r1, 90deg))
                    scale(0.75);
                filter: brightness(1.2) contrast(1.15);
            }
            75% {
                opacity: 0.55;
                transform:
                    translate(calc(var(--char-dx, -12px) * 0.8), calc(var(--char-dy, 0px) * 0.8))
                    rotate(var(--char-r2, 220deg))
                    scale(0.3);
                filter: brightness(0.6) blur(0.5px);
            }
            100% {
                opacity: 0;
                transform:
                    translate(var(--char-dx, -12px), var(--char-dy, 0px))
                    rotate(var(--char-r3, 360deg))
                    scale(0.02);
                filter: brightness(0.2) blur(2px);
            }
        }
        .char-animate.blackHole {
            animation: char-blackHole var(--char-anim-duration) cubic-bezier(0.55, 0.05, 0.7, 0.2) forwards;
        }

        /* ── En masse: area burst over a deleted region ─ */
        .area-burst {
            position: absolute;
            pointer-events: none;
            z-index: 9999;
            border: none;
            border-radius: 50%;
            will-change: transform, opacity;
            background: radial-gradient(
                circle at center,
                rgba(var(--accent-rgb), 0.55) 0%,
                rgba(var(--accent-rgb), 0.28) 28%,
                rgba(var(--accent-rgb), 0.08) 55%,
                transparent 72%
            );
            animation: area-burst 300ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes area-burst {
            0% { opacity: 0; transform: scale(0.25); }
            15% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(1.55); }
            100% { opacity: 0; transform: scale(2.1); }
        }

        /* ── Row glow on newline ─────────────────────── */
        .row-glow {
            position: absolute;
            pointer-events: none;
            z-index: 99999;
            border-radius: 4px;
            will-change: opacity;
            background: transparent;
            box-shadow:
                inset 0 0 14px rgba(255, 255, 255, 0.3),
                0 0 20px rgba(255, 255, 255, 0.12);
            animation: row-glow-fade 600ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes row-glow-fade {
            0% { opacity: 0; }
            15% { opacity: 1; }
            40% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        /* ── Status Bar ──────────────────────────────── */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 4px 16px;
            background: var(--bg-elevated);
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script src="lib/react.production.min.js"></script>
    <script src="lib/react-dom.production.min.js"></script>
    <script src="lib/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        let _idCounter = 0;
        const uid = () => ++_idCounter;

        const randomColor = () =>
            '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');

        const createTab = (name, content = '') => ({
            id: uid(),
            name,
            html: content || '',
            text: '',
            color: randomColor(),
        });

        // ═══════════════════════════════════════════════
        //  Utility: get character bounds via Range API
        // ═══════════════════════════════════════════════
        function getCharBounds(editorEl, offset) {
            const text = editorEl.innerText;
            if (offset < 0 || offset >= text.length) return null;

            let charIndex = 0;
            const walker = document.createTreeWalker(editorEl, NodeFilter.SHOW_TEXT);
            while (walker.nextNode()) {
                const node = walker.currentNode;
                const len = node.textContent.length;
                if (charIndex + len > offset) {
                    const range = document.createRange();
                    range.setStart(node, offset - charIndex);
                    range.setEnd(node, offset - charIndex + 1);
                    const rect = range.getBoundingClientRect();
                    return { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
                }
                charIndex += len;
            }
            return null;
        }

        // Get bounds for a selected range of text
        function getSelectionBounds(editorEl) {
            const sel = window.getSelection();
            if (!sel.rangeCount || !editorEl.contains(sel.anchorNode)) return null;
            const range = sel.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            return { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
        }

        // Convert a DOM Range's start to an innerText offset within editorEl (tree-order walk)
        function getStartOffsetInRange(editorEl, targetRange) {
            let charIndex = 0;
            const walker = document.createTreeWalker(editorEl, NodeFilter.SHOW_TEXT);
            while (walker.nextNode()) {
                const node = walker.currentNode;
                if (node === targetRange.startContainer) {
                    return charIndex + Math.min(targetRange.startOffset, node.textContent.length);
                }
                charIndex += node.textContent.length;
            }
            return 0;
        }

        // Collect character data for a text range in the editor
        function collectCharsInRange(editorEl, startOffset, length) {
            const text = editorEl.innerText;
            const chars = [];
            const rects = [];
            const styles = [];
            let charIndex = 0;
            const walker = document.createTreeWalker(editorEl, NodeFilter.SHOW_TEXT);

            while (walker.nextNode()) {
                const node = walker.currentNode;
                const nodeStart = charIndex;
                const nodeEnd = charIndex + node.textContent.length;

                if (nodeEnd <= startOffset) { charIndex += node.textContent.length; continue; }
                if (nodeStart >= startOffset + length) break;

                const localStart = Math.max(0, startOffset - nodeStart);
                const localEnd = Math.min(node.textContent.length, startOffset + length - nodeStart);

                for (let i = localStart; i < localEnd; i++) {
                    const ch = node.textContent[i];
                    if (ch === '\n') continue;
                    const range = document.createRange();
                    range.setStart(node, i);
                    range.setEnd(node, i + 1);
                    const rect = range.getBoundingClientRect();
                    chars.push(ch);
                    rects.push({ left: rect.left, top: rect.top, width: rect.width, height: rect.height });
                    const parent = node.parentElement || editorEl;
                    styles.push(getComputedStyle(parent));
                }

                charIndex += node.textContent.length;
            }
            return { chars, rects, styles };
        }

        // ═══════════════════════════════════════════════
        //  Animation overlay system (shared)
        // ═══════════════════════════════════════════════
        const DESTRUCTIVE_EFFECTS = new Set(['destroy', 'evaporate', 'debris', 'blackHole', 'confetti', 'shatter']);

        const EFFECTS = {
            flyIn: { revealAt: 70, vars: (int, o) => { const offset = 18; return `--char-anim-offset: ${(o.dir.y * offset * int).toFixed(1)}px; --char-anim-drift-x: ${(o.dir.x * offset * 1.2 * int).toFixed(1)}px; --char-anim-scale: ${(1 + 0.15 * int).toFixed(2)};`; } },
            digitize: { revealAt: 85, params: (int) => ({ b1:6*int, b2:3*int, b3:1*int, s1:1+0.3*int, s2:1+0.1*int, s3:1+0.02*int }) },
            pop: { revealAt: 55, params: (int) => ({ s1:1+0.18*int, s2:1-0.06*int }) },
            slam: { revealAt: 55, params: (int) => ({ d1:-30*int, d2:3*int, d3:-1*int, s1:1+0.2*int }) },
            spin: { revealAt: 55, type: 'typing', params: (int) => { const turns = Math.max(1, Math.round(1 + int)); const dir = Math.random() < 0.5 ? -1 : 1; return { s1: Math.max(0.2, 0.45 - 0.1 * int), s2: 1 + 0.14 * int, 'spin-y0': dir * (90 + 40 * int), 'spin-y1': -dir * (12 + 10 * int), 'spin-z0': dir * turns * -360, 'spin-z1': dir * (18 + 14 * int) }; } },
            wave: { revealAt: 30, params: (int) => ({ d1:7*int, d2:-5*int, d3:2*int, d4:-1*int, s1:1-0.15*int, s2:1+0.05*int }) },
            typewriter: { revealAt: 55, params: (int) => ({ d1: -4 - 4 * int }) },
            glitch: { revealAt: 20, params: (int) => { const j = 2 + 4 * int; return { d1: (Math.random() < 0.5 ? -1 : 1) * j, d2: (Math.random() < 0.5 ? -1 : 1) * j * 0.6, d3: (Math.random() < 0.5 ? -1 : 1) * j * 0.8, d4: (Math.random() < 0.5 ? -1 : 1) * j * 0.5, d5: (Math.random() < 0.5 ? -1 : 1) * j * 0.4, r1: (Math.random() < 0.5 ? -1 : 1) * (6 + 6 * int), r2: (Math.random() < 0.5 ? -1 : 1) * (4 + 5 * int), gx: 2 + 3 * int }; } },
            inkBlot: { revealAt: 75, params: (int) => ({ b1: 4 + 4 * int, b2: 1.5 + 1.5 * int, s1: 1.4 + 0.5 * int, s2: 1.08 + 0.12 * int, r1: (Math.random() < 0.5 ? -1 : 1) * (6 + 8 * int), r2: (Math.random() < 0.5 ? -1 : 1) * (2 + 4 * int) }) },
            magnetic: { revealAt: 55, params: (int, o) => { const side = o && o.side != null ? o.side : (Math.random() < 0.5 ? -1 : 1); const arc = (18 + 16 * int); return { d1: side * arc * (0.7 + Math.random() * 0.5), d2: arc * (0.4 + Math.random() * 0.6), d3: -side * (3 + 4 * int), d4: -(4 + 5 * int), s1: 0.4 + 0.1 * Math.random(), s2: 1.05 + 0.08 * int, r1: side * -(15 + 18 * int), r2: side * (6 + 8 * int) }; } },
            xirtam: { revealAt: 65, params: (int) => ({ d1: -(22 + 18 * int), d2: -(6 + 4 * int), s1: 1.05 + 0.15 * int }) },
            destroy: {
                params: (int, o) => {
                    const ang = o && typeof o.angle === 'number' ? o.angle : Math.random() * Math.PI * 2;
                    const dist = (o && o.dist != null ? o.dist : (28 + Math.random() * 42)) * int;
                    const spin = (120 + Math.random() * 220) * (Math.random() < 0.5 ? -1 : 1) * int;
                    return {
                        dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist - 8 * int,
                        s1: 1 + 0.12 * int, s2: 1 + 0.28 * int, s3: 1 + 0.05 * int,
                        s4: Math.max(0.25, 0.7 - 0.15 * int),
                        r1: spin * 0.35, r2: spin,
                    };
                },
            },
            debris: {
                params: (int, o) => {
                    const ang = o && typeof o.angle === 'number' ? o.angle : Math.random() * Math.PI * 2;
                    const power = o && o.power != null ? o.power : (0.55 + Math.random() * 0.9);
                    const dist = (36 + Math.random() * 90) * power * int;
                    const spin = (160 + Math.random() * 420) * (Math.random() < 0.5 ? -1 : 1) * power;
                    const fall = (18 + Math.random() * 55) * int;
                    return {
                        dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist * 0.75 - 12 * power * int,
                        fall, s1: 1 + 0.25 * power * int, s2: 0.85 + 0.2 * Math.random(),
                        s3: 0.2 + 0.25 * Math.random(), r1: spin * 0.45, r2: spin,
                    };
                },
            },
            evaporate: { params: (int) => ({ d1:-10*int, d2:-22*int, d3:-34*int, s1:1+0.05*int, s2:1+0.12*int, s3:1+0.2*int, b1:1*int, b2:2*int, b3:5*int }) },

            shatter: {

                    return {
                        dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist + (10 + Math.random() * 24) * int,

            },
            confetti: {
                params: (int, o) => {
                    const ang = o && typeof o.angle === 'number' ? o.angle : (-Math.PI / 2 + (Math.random() - 0.5) * 1.8);
                    const dist = (20 + Math.random() * 50) * int;
                    const spin = (90 + Math.random() * 280) * (Math.random() < 0.5 ? -1 : 1);

        const buildVars = (v) => {
            let css = '';
            for (const [k, val] of Object.entries(v)) {
                if (val == null || typeof val === 'boolean' || k === 'color') continue;
                let unit = '';
                if (['dx','dy','fall','gx'].includes(k) || k.startsWith('d') || k.startsWith('b')) unit = 'px';
                else if (k.startsWith('r') || k.startsWith('spin-')) unit = 'deg';

        // ═══════════════════════════════════════════════
        //  NativeEditor — contenteditable + animation
        // ═══════════════════════════════════════════════
        function NativeEditor({ html, onContentChange, animDuration, animEnabled, animEffect, flyInDirection, animOffset, deleteEffect, intensity, delDuration, delIntensity, revealAtOverride }) {
            const editorRef = useRef(null);
            const overlayRef = useRef(null);
            const activeOverlays = useRef([]);
            const onChangeRef = useRef(onContentChange);
            const isComposing = useRef(false);

            // Cached computed style for the editor
            const cachedStyle = useRef({
                fontFamily: '', fontSize: '', lineHeight: '', fontWeight: '', fontStyle: '', color: ''
            });

            const ensureFreshStyle = useCallback(() => {
                const el = editorRef.current;
                if (!el) return;
                const cs = getComputedStyle(el);
                cachedStyle.current = {
                    fontFamily: cs.fontFamily, fontSize: cs.fontSize,
                    lineHeight: cs.lineHeight, fontWeight: cs.fontWeight || 'normal',
                    fontStyle: cs.fontStyle || 'normal', color: cs.color

            }, []);

            // Create overlay container on mount
            useEffect(() => {
                const editor = editorRef.current;
                if (!editor) return;

                const overlayContainer = document.createElement('div');
                overlayContainer.style.cssText = `
                    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                    pointer-events: none; z-index: 9999; overflow: hidden;
                `;
                editor.parentElement.appendChild(overlayContainer);
                overlayRef.current = overlayContainer;

                ensureFreshStyle();

                return () => {
                    if (overlayContainer.parentNode) overlayContainer.remove();
                    overlayRef.current = null;
                };

            const spawnOverlay = useCallback((char, bounds, effect, opts, charStyle) => {
                const container = overlayRef.current;
                if (!container || !bounds) return;

                const doSpawn = () => {
                    ensureFreshStyle();
                    const editorRect = editorRef.current.getBoundingClientRect();
                    const overlayRect = container.getBoundingClientRect();
                    const left = (bounds.left - overlayRect.left).toFixed(1);
                    const top = (bounds.top - overlayRect.top).toFixed(1);

                    const isDestructive = DESTRUCTIVE_EFFECTS.has(effect);
                    const int = isDestructive ? delIntensity : intensity;
                    const dur = opts?.durationMs || (isDestructive ? delDuration : animDuration);
                    const sty = charStyle || cachedStyle.current;

                    let extraVars = '';
                    let colorOverride = '';
                    if (EFFECTS[effect]?.vars) {
                        extraVars = EFFECTS[effect].vars(int, opts || {});
                    } else if (EFFECTS[effect]?.params) {
                        const p = EFFECTS[effect].params(int, opts);
                        extraVars = buildVars(p);
                        if (p.color) colorOverride = `color: ${p.color} !important;`;
                    }

                    const overlay = document.createElement('span');
                    overlay.className = `char-animate ${effect}`;
                    overlay.textContent = char;
                    overlay.style.cssText = `
                        font-family: ${sty.fontFamily};
                        font-size: ${sty.fontSize};
                        line-height: ${sty.lineHeight};
                        font-weight: ${sty.fontWeight || 'normal'};
                        font-style: ${sty.fontStyle || 'normal'};
                        color: ${sty.color};
                        left: ${left}px;
                        top: ${top}px;
                        ${extraVars} ${colorOverride}

                    `;

                    container.appendChild(overlay);

                    // Typewriter effect: add strike bar underneath character
                    if (effect === 'typewriter') {
                        const bar = document.createElement('div');
                        bar.className = 'char-typewriter-bar';
                        bar.style.cssText = `left:${left}px;top:${(Number(top) + Number(sty.fontSize || 15)).toFixed(1)}px;width:${bounds.width}px;background:var(--accent);--char-anim-duration:${dur}ms;`;
                        container.appendChild(bar);
                        const barCleanup = () => { if (bar.parentNode) bar.remove(); };

                    }

                    // XIRTAM effect: Matrix-style random ASCII decode into real char
                    if (effect === 'xirtam') {
                        const trail = document.createElement('span');
                        trail.className = 'char-animate xirtam-trail';
                        trail.textContent = char;
                        trail.style.cssText = `font-family:${sty.fontFamily};font-size:${sty.fontSize};left:${left}px;top:${(Number(top) + 2).toFixed(1)}px;color:#22cc55;text-shadow:0 0 6px #00ff55;--char-anim-duration:${dur}ms;`;
                        container.appendChild(trail);
                        const trailCleanup = () => { if (trail.parentNode) trail.remove(); };
                        trail.addEventListener('animationend', trailCleanup, { once: true });
                        setTimeout(trailCleanup, dur + 80);

                        // Cycle random ASCII chars before locking to real character
                        const asciiChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                        let xirtamInterval = setInterval(() => {
                            overlay.textContent = asciiChars[Math.floor(Math.random() * asciiChars.length)];
                        }, 30);
                        setTimeout(() => {
                            clearInterval(xirtamInterval);
                            overlay.textContent = char;
                        }, dur * 0.65);
                    }

                    const cleanup = () => {
                        if (overlay.parentNode) overlay.remove();
                        const i = activeOverlays.current.indexOf(overlay);
                        if (i !== -1) activeOverlays.current.splice(i, 1);
                    };
                    overlay.addEventListener('animationend', cleanup, { once: true });
                    setTimeout(cleanup, dur + 80);
                };

                const delayMs = opts?.delayMs || 0;
                if (delayMs > 0) setTimeout(doSpawn, delayMs); else doSpawn();
            }, [animDuration, animEffect, deleteEffect, intensity, delDuration, delIntensity, ensureFreshStyle]);

            // Spawn mass destruction effect for selected range
            const spawnMassEffect = useCallback((chars, rects, area, effect) => {
                if (!chars.length || !rects.length) return;
                const container = overlayRef.current;
                if (!container) return;

                const int = delIntensity;
                const baseDur = delDuration;
                const useDebris = effect === 'destroy' || effect === 'debris';

                for (let i = 0; i < chars.length; i++) {
                    const ch = chars[i];
                    const r = rects[i];
                    if (!ch || !r) continue;

                    const stagger = Math.floor(i * (10 + 6 * int) / Math.max(1, chars.length / 10));

                    if (useDebris) {
                        const ang = Math.random() * Math.PI * 2;
                        const power = 0.55 + Math.random() * 0.9;
                        spawnOverlay(ch, r, 'debris', {
                            angle: ang, power,
                            delayMs: stagger,
                            durationMs: Math.round(baseDur * (0.85 + Math.random() * 0.55)),
                        });
                    } else if (effect === 'shatter') {
                        const ang = Math.random() * Math.PI * 2;
                        spawnOverlay(ch, r, 'shatter', {
                            angle: ang,
                            delayMs: Math.floor(stagger * 0.5),
                            durationMs: Math.round(baseDur * (0.9 + Math.random() * 0.4)),
                        });
                    } else if (effect === 'confetti') {
                        const ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
                        spawnOverlay(ch, r, 'confetti', {
                            angle: ang,
                            delayMs: stagger,
                            durationMs: Math.round(baseDur * (1.1 + Math.random() * 0.7)),
                        });
                    } else if (effect === 'blackHole') {
                        spawnOverlay(ch, r, 'blackHole', {
                            dx: -14 * int, dy: 0,
                            delayMs: stagger,
                            durationMs: Math.round(baseDur * (1 + Math.random() * 0.35)),
                        });
                    } else if (effect === 'evaporate') {
                        spawnOverlay(ch, r, 'evaporate', { delayMs: stagger });
                    } else {
                        spawnOverlay(ch, r, effect, { delayMs: stagger });
                    }
                }

                // Area burst for destroy/debris
                if ((effect === 'destroy' || effect === 'debris') && area) {
                    const editorRect = editorRef.current.getBoundingClientRect();
                    const overlayRect = container.getBoundingClientRect();
                    const size = Math.max(48, Math.max(area.width, area.height) * 1.15 + 28);
                    const cx = area.cx - overlayRect.left;
                    const cy = area.cy - overlayRect.top;

                    const burst = document.createElement('div');
                    burst.className = 'area-burst';
                    burst.style.cssText = `
                        left: ${cx - size / 2}px; top: ${cy - size / 2}px;
                        width: ${size}px; height: ${size}px;
                    `;
                    container.appendChild(burst);
                    const cleanup = () => { if (burst.parentNode) burst.remove(); };
                    burst.addEventListener('animationend', cleanup, { once: true });
                    setTimeout(cleanup, 400);
                }
            }, [spawnOverlay, delDuration, delIntensity]);

            // Sync HTML content from props
            useEffect(() => {
                const editor = editorRef.current;

                if (editor.innerHTML !== html) {

                }
            }, [html]);

            // Report changes to parent
            const reportChange = useCallback(() => {
                const editor = editorRef.current;
                if (!editor || !onChangeRef.current) return;
                onChangeRef.current(editor.innerHTML, editor.innerText);
            }, []);

            // Insert animated inline span for a character or text segment
            const insertAnimatedSpan = useCallback((text, effect, opts) => {
                const editor = editorRef.current;
                if (!editor) return;

                const sel = window.getSelection();
                if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return;

                const range = sel.getRangeAt(0);

                const isDestructive = DESTRUCTIVE_EFFECTS.has(effect);
                const int = isDestructive ? delIntensity : intensity;
                const dur = opts?.durationMs || (isDestructive ? delDuration : animDuration);

                let extraVars = '';
                if (EFFECTS[effect]?.vars) {
                    extraVars = EFFECTS[effect].vars(int, opts || {});
                } else if (EFFECTS[effect]?.params) {
                    const p = EFFECTS[effect].params(int, opts);
                    extraVars = buildVars(p);
                }

                const revealAt = Math.min(100, Math.max(0, revealAtOverride !== null ? revealAtOverride : (opts?.revealOverride ?? EFFECTS[effect]?.revealAt ?? 70)));

                // Wrap each character in its own animated span for staggered animation on paste
                const chars = text.split('');
                const spans = [];
                for (let i = 0; i < chars.length; i++) {
                    const ch = chars[i];
                    if (ch === '\n') continue;

                    const span = document.createElement('span');
                    span.className = `char-inline ${effect}`;
                    span.textContent = ch;
                    span.style.cssText = `--char-anim-duration:${dur}ms; --reveal-at:${revealAt}%; ${extraVars}`;

                    const staggerDelay = (chars.length > 1 && opts?.stagger !== false) ? Math.min(i * (8 + 5 * intensity), 2400) : 0;
                    if (staggerDelay > 0) span.style.animationDelay = `${staggerDelay}ms`;

                        const xirtamInterval = setInterval(() => {
                            span.textContent = asciiChars[Math.floor(Math.random() * asciiChars.length)];
                        }, 30);
                        setTimeout(() => {
                            clearInterval(xirtamInterval);
                            if (span.parentNode) span.textContent = ch;
                        }, dur * 0.65 + staggerDelay);
                    }

                    // Clean up animation after it completes - remove class/styles but keep span as invisible wrapper
                    const cleanupSpan = () => {
                        if (!span.parentNode) return;
                        span.className = '';
                        span.style.cssText = 'opacity:1;display:inline;';
                    };
                    span.addEventListener('animationend', cleanupSpan, { once: true });
                    setTimeout(cleanupSpan, dur + staggerDelay + 100);

                    spans.push(span);
                }

                // Insert all spans at caret position using DocumentFragment to preserve order
                if (spans.length > 0) {
                    range.deleteContents();
                    const fragment = document.createDocumentFragment();
                    for (const span of spans) fragment.appendChild(span);
                    range.insertNode(fragment);

                    const lastSpan = spans[spans.length - 1];
                    range.setStartAfter(lastSpan);
                    range.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(range);

            // Keyboard handler — intercept insert/delete for animation
            useEffect(() => {
                const editor = editorRef.current;
                if (!editor) return;

                const handleKeydown = (e) => {

                    // Row glow on Enter

                            if (container) {
                                const overlayRect = container.getBoundingClientRect();
                                const glow = document.createElement('div');
                                glow.className = 'row-glow';
                                glow.style.cssText = `left:${(rect.left - overlayRect.left).toFixed(1)}px;top:${(rect.top - overlayRect.top).toFixed(1)}px;width:${Math.max(rect.width, 200)}px;height:${rect.height}px;`;

                    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown','Tab'].includes(e.key)) return;

                    const sel = window.getSelection();
                    if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return;
                    const range = sel.getRangeAt(0);

                    // Delete/Backspace with selection — mass effect for selected range
                    if ((e.key === 'Delete' || e.key === 'Backspace') && !range.collapsed) {
                        const text = range.toString();
                        if (text.length >= 1) {
                            e.preventDefault();
                            const selRect = getSelectionBounds(editor);
                            const startOffset = getStartOffsetInRange(editor, range);

                            // Collect per-character data only for the selected portion
                            const selectionData = collectCharsInRange(editor, startOffset, text.length);

                            if (selectionData.chars.length > 0 && selRect) {
                                spawnMassEffect(
                                    selectionData.chars,
                                    selectionData.rects,

                            }

                            document.execCommand('delete');
                            reportChange();
                            return;
                        }
