                            e.preventDefault();
                            e.stopPropagation();
                            spawnMassEffect(chars, rects, area, deleteEffectRef.current, styles);
                            quill.deleteText(sel.index, sel.length, 'user');
                            quill.setSelection(sel.index, 0, 'silent');
                            return;
                        }

                        const delPos = e.key === 'Backspace' ? sel.index - 1 : sel.index;
                        if (delPos < 0 || delPos >= text.length) return;

                        const char = text[delPos];
                        if (char === '\n') return; // let native handle line breaks

                        const bounds = quill.getBounds(delPos, 1);
                        if (!bounds) return;

                        const charStyle = getCharStyleAt(delPos);

                        const effect = deleteEffectRef.current;
                        let opts = null;
                        if (effect === 'blackHole') {
                            // Target: caret position after deletion (sel.index for both Backspace and Delete)
                            const cb = quill.getBounds(sel.index, 0);
                            if (cb) {
                                const cx = bounds.left + bounds.width / 2;
                                const cy = bounds.top + bounds.height / 2;
                                opts = {
                                    dx: (cb.left + (cb.width || 0) / 2) - cx,
                                    dy: (cb.top + (cb.height || 0) / 2) - cy,
                                };
                            } else if (e.key === 'Delete') {
                                opts = { dx: bounds.width * 1.5, dy: 0 };
                            } else {
                                opts = { dx: -bounds.width * 1.2, dy: 0 };
                            }
                        } else if (effect === 'destroy' || effect === 'shatter' || effect === 'confetti') {
                            const ang = effect === 'confetti'
                                ? (-Math.PI / 2 + (Math.random() - 0.5) * 1.6)
                                : Math.random() * Math.PI * 2;
                            opts = {
                                angle: ang,
                                dist: 32 + Math.random() * 48,
                                power: 0.8 + Math.random() * 0.5,
                            };
                        }

                        e.preventDefault();
                        e.stopPropagation();

                        quill.deleteText(delPos, 1, 'user');
                        quill.setSelection(delPos, 0, 'silent');

                        spawnOverlay(char, bounds, effect, opts, charStyle);
                        return;
                    }

                    // ── Typing ──────────────────────────────
                    if (e.key.length > 1) return;

                    const sel = quill.getSelection();
                    if (!sel) return;

                    e.preventDefault();
                    e.stopPropagation();

                    const char = e.key;
                    const index = sel.index;

                    if (sel.length > 0) {
                        const { chars, rects, styles, area } = collectChars(index, sel.length);
                        spawnMassEffect(chars, rects, area, deleteEffectRef.current, styles);
                        quill.deleteText(index, sel.length, 'user');
                    }
                    quill.insertText(index, char, 'user');
                    quill.setSelection(index + 1, 0, 'silent');

                    const bounds = quill.getBounds(index, 1);
                    const charStyle = getCharStyleAt(index);
                    spawnOverlay(char, bounds, animEffectRef.current, { dir: pickDirection(flyInDirectionRef.current) }, charStyle);

                    // Auto-scroll if caret near bottom of visible area
                    requestAnimationFrame(() => {
                        const sc = editorEl.closest('.ql-editor') || quill.root;
                        const caretBounds = quill.getBounds(index + 1, 0);
                        if (caretBounds) {
                            const lineBottom = caretBounds.top + (caretBounds.height || 24);
                            if (lineBottom > sc.scrollTop && lineBottom >= sc.scrollTop + sc.clientHeight * 0.5) {
                                sc.scrollTop = Math.max(0, lineBottom - sc.clientHeight * 0.75);
                            }
                        }
                    });
                }, true);

                // ── Paste: destroy old selection, animate new characters in ──
                container.addEventListener('paste', e => {
                    if (e.target !== editorEl && !editorEl.contains(e.target)) return;
                    if (!animEnabledRef.current) return;
                    const pasted = (e.clipboardData || window.clipboardData).getData('text/plain');
                    if (!pasted) return;

                    const sel = quill.getSelection();
                    if (!sel) return;

                    e.preventDefault();
                    e.stopPropagation();

                    // Destroy selected text before replacing it
                    if (sel.length > 0) {
                        const { chars, rects, styles, area } = collectChars(sel.index, sel.length);
                        spawnMassEffect(chars, rects, area, deleteEffectRef.current, styles);
                        quill.deleteText(sel.index, sel.length, 'user');
                    }

                    quill.insertText(sel.index, pasted, 'user');

                    // Animate new characters with typing effect
                    const pasteLen = Math.min(pasted.length, 60);
                    for (let i = 0; i < pasteLen; i++) {
                        if (pasted[i] === '\n') continue;
                        const b = quill.getBounds(sel.index + i, 1);
                        if (!b) continue;
                        const charStyle = getCharStyleAt(sel.index + i);
                        spawnOverlay(pasted[i], b, animEffectRef.current, { dir: pickDirection(flyInDirectionRef.current) }, charStyle);
                    }

                    quill.setSelection(sel.index + pasted.length, 0, 'silent');

                    // Auto-scroll for paste
                    requestAnimationFrame(() => {
                        const sc = editorEl.closest('.ql-editor') || quill.root;
                        const endIdx = sel.index + pasted.length - (pasted[pasted.length - 1] === '\n' ? 0 : 1);
                        const caretBounds = quill.getBounds(endIdx, 0);
                        if (caretBounds) {
                            const lineBottom = caretBounds.top + (caretBounds.height || 24);
                            if (lineBottom > sc.scrollTop && lineBottom >= sc.scrollTop + sc.clientHeight * 0.5) {
                                sc.scrollTop = Math.max(0, lineBottom - sc.clientHeight * 0.75);
                            }
                        }
                    });
                }, true);

                quill.on('text-change', () => {
                    const ops = quill.getContents().ops || [];
                    const text = quill.getText();
                    if (onChangeRef.current) onChangeRef.current(ops, text);
                });

                return () => {
                    quillRef.current = null;
                    container.innerHTML = '';
                };
            }, []);

            // Sync animation settings from parent
            useEffect(() => {
                const quill = quillRef.current;
                if (quill?._charAnimDuration) quill._charAnimDuration.current = animDuration;
                if (quill?._charAnimEnabled) quill._charAnimEnabled.current = animEnabled;
                if (quill?._charAnimEffect) quill._charAnimEffect.current = animEffect;
                if (quill?._flyInDirection) quill._flyInDirection.current = flyInDirection;
                if (quill?._charAnimOffset) quill._charAnimOffset.current = animOffset;
                if (quill?._charDeleteEffect) quill._charDeleteEffect.current = deleteEffect;
                if (quill?._charIntensity) quill._charIntensity.current = intensity;
                if (quill?._delDuration) quill._delDuration.current = delDuration;
                if (quill?._delOffset) quill._delOffset.current = delOffset;
                if (quill?._delIntensity) quill._delIntensity.current = delIntensity;
                if (quill?._rowGlowScope) quill._rowGlowScope.current = rowGlowScope;
            }, [animDuration, animEnabled, animEffect, flyInDirection, animOffset, deleteEffect, intensity, delDuration, delOffset, delIntensity, rowGlowScope]);

            useEffect(() => {
                const quill = quillRef.current;
                if (!quill) return;
                quill.enable(!readOnly);
                if (delta) {
                    const current = quill.getContents();
                    if (JSON.stringify(current.ops) !== JSON.stringify(delta)) {
                        quill.setContents(delta, 'silent');
                    }
                } else {
                    quill.setText('', 'silent');
                }
            }, [delta, readOnly]);

            return <div ref={containerRef} style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }} />;
        }

        // ═══════════════════════════════════════════════
        //  TabBar
        // ═══════════════════════════════════════════════
        function TabBar({ tabs, activeId, onSelect, onClose, onAdd }) {
            return (
                <div className="tab-bar">
                    {tabs.map(tab => (
                        <div
                            key={tab.id}
                            className={'tab' + (tab.id === activeId ? ' active' : '')}
                            onClick={() => onSelect(tab.id)}
                        >
                            <div className="tab-dot" style={{ background: tab.color }} />
                            <span>{tab.name}</span>
                            <div
                                className="tab-close"
                                onClick={e => { e.stopPropagation(); onClose(tab.id); }}
                            >
                                &times;
                            </div>
                        </div>
                    ))}
                    <div className="tab" onClick={onAdd} style={{ opacity: 0.6 }}>
                        <span>+</span>
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════
        //  FloatWindow — draggable, resizable editor window
        // ═══════════════════════════════════════════════
        function FloatWindow({ tab, x, y, w, h, minimized, maximized, focused, zIndex, onFocus, onMinimize, onMaximize, onClose, onDrag, onResize, onContentChange, animDuration, animEnabled, animEffect, flyInDirection, animOffset, deleteEffect, intensity, delDuration, delOffset, delIntensity, rowGlowScope }) {
            const titlebarRef = useRef(null);
            const windowRef = useRef(null);

            // Drag handler — direct DOM manipulation for smooth movement
            const onStartDrag = useCallback(e => {
                if (maximized) return;
                e.preventDefault();
                e.stopPropagation();
                onFocus();
                const el = windowRef.current;
                if (!el) return;
                const startX = e.clientX;
                const startY = e.clientY;
                document.body.style.userSelect = 'none';

                const onMouseMove = ev => {
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    el.style.transform = `translate(${dx}px, ${dy}px)`;
                };
                const onMouseUp = ev => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    document.body.style.userSelect = '';
                    // Commit final offset to state (absolute from original)
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    el.style.transform = '';
                    onDrag(dx, dy);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }, [maximized, onFocus, onDrag]);

            // Resize handler — direct DOM manipulation for smooth resizing
            const onStartResize = useCallback(e => {
                if (maximized) return;
                e.preventDefault();
                e.stopPropagation();
                onFocus();
                const el = windowRef.current;
                if (!el) return;
                const startX = e.clientX;
                const startY = e.clientY;
                const startW = el.offsetWidth;
                const startH = el.offsetHeight;
                document.body.style.cursor = 'nwse-resize';
                document.body.style.userSelect = 'none';

                const onMouseMove = ev => {
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    el.style.width = Math.max(320, startW + dx) + 'px';
                    el.style.height = Math.max(200, startH + dy) + 'px';
                };
                const onMouseUp = ev => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    el.style.width = '';
                    el.style.height = '';
                    onResize(dx, dy);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }, [maximized, onFocus, onResize]);

            const className = ['float-window'];
            if (focused) className.push('focused');
            if (maximized) className.push('maximized');
            if (minimized) className.push('minimized');

            const style = maximized
                ? { position: 'absolute', inset: 0, zIndex }
                : { left: typeof x === 'number' ? x + 'px' : x, top: typeof y === 'number' ? y + 'px' : y, width: w, height: h, zIndex };

            return (
                <div
                    ref={windowRef}
                    className={className.join(' ')}
                    style={style}
                    onMouseDown={onFocus}
                >
                    {/* Title bar / drag handle */}
                    <div
                        ref={titlebarRef}
                        className="window-titlebar"
                        onMouseDown={onStartDrag}
                    >
                        <div className="tab-dot" style={{ background: tab.color }} />
                        <span className="window-title">{tab.name}</span>
                        <div className="window-controls">
                            <button className="window-btn" onClick={onMinimize} title={minimized ? 'Restore' : 'Minimize'}>
                                {minimized ? '□' : '—'}
                            </button>
                            <button className="window-btn" onClick={onMaximize} title={maximized ? 'Restore' : 'Maximize'}>
                                {maximized ? '⊡' : '☐'}
                            </button>
                            <button className="window-btn close-btn" onClick={onClose} title="Close">
                                &times;
                            </button>
                        </div>
                    </div>

                    {/* Editor content (hidden when minimized) */}
                    {!minimized && (
                        <div className="editor-area" style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
                            <QuillEditor
                                key={tab.id}
                                delta={tab.content}
                                onContentChange={(ops, text) => onContentChange(tab.id, ops, text)}
                                animDuration={animDuration}
                                animEnabled={animEnabled}
                                animEffect={animEffect}
                                flyInDirection={flyInDirection}
                                animOffset={animOffset}
                                deleteEffect={deleteEffect}
                                intensity={intensity}
                                delDuration={delDuration}
                                delOffset={delOffset}
                                delIntensity={delIntensity}
                                rowGlowScope={rowGlowScope}
                            />
                        </div>
                    )}

                    {/* Resize handle */}
                    {!maximized && (
                        <div
                            className="resize-handle"
                            style={{
                                position: 'absolute', bottom: 0, right: 0, width: 16, height: 16,
                                cursor: 'nwse-resize', zIndex: 1,
                            }}
                            onMouseDown={onStartResize}
                        />
                    )}
                </div>
            );
        }

        // ═══════════════════════════════════════════════
        //  App
        // ═══════════════════════════════════════════════
        function App() {
            const firstTabRef = useRef(createTab('Untitled'));
            const [tabs, setTabs] = useState(() => [firstTabRef.current]);
            const [activeId, setActiveId] = useState(() => firstTabRef.current.id);
            const [fileName, setFileName] = useState('Untitled');
            const [fileExt, setFileExt] = useState('.txt');
            const [isDark, setIsDark] = useState(true);
            const [animDuration, setAnimDuration] = useState(200);
            const [animOffset, setAnimOffset] = useState(18);
            const [animEnabled, setAnimEnabled] = useState(true);
            const [animEffect, setAnimEffect] = useState('flyIn');
            const [flyInDirection, setFlyInDirection] = useState('random');
            const [deleteEffect, setDeleteEffect] = useState('destroy');
            const [intensity, setIntensity] = useState(1);
            const [delDuration, setDelDuration] = useState(200);
            const [delOffset, setDelOffset] = useState(18);
            const [delIntensity, setDelIntensity] = useState(1);
            const [rowGlowScope, setRowGlowScope] = useState('paragraph');

            // Floating windows state (positions and sizes in pixels)
            const workspaceRef = useRef(null);
            const [windows, setWindows] = useState(() => {
                const id = firstTabRef.current.id;
                return [{ tabId: id, x: 60, y: 30, w: 720, h: 480, minimized: false, maximized: false }];
            });
            const [nextZIndex, setNextZIndex] = useState(10);

            // Compute default window position (centered with offset)
            const getWindowDefaultPos = useCallback(() => {
                const count = windows.length;
                const offsetX = 40 + (count % 5) * 30;
                const offsetY = 20 + (count % 5) * 30;
                return { x: offsetX, y: offsetY };
            }, [windows]);

            // Focus a window by tabId (bring to front, restore if minimized)
            const focusWindow = useCallback((tabId, e) => {
                if (e && e.stopPropagation) e.stopPropagation();
                setWindows(prev => prev.map(w =>
                    w.tabId === tabId ? { ...w, minimized: false } : w
                ));
                setActiveId(tabId);
                setNextZIndex(z => z + 1);
            }, []);

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            }, [isDark]);

            // Sync animation CSS variables
            useEffect(() => {
                const root = document.documentElement;
                root.style.setProperty('--char-anim-duration', animDuration + 'ms');
                root.style.setProperty('--char-anim-offset', -animOffset + 'px');
                root.style.setProperty('--char-anim-scale', (1 + animOffset / 20).toFixed(2));
            }, [animDuration, animOffset]);

            // Total word count across all tabs
            const totalWords = useMemo(() => {
                return tabs.reduce((sum, t) => {
                    const w = t.text && t.text.trim() ? t.text.trim().split(/\s+/).length : 0;
                    return sum + w;
                }, 0);
            }, [tabs]);

            // ── Tab actions ────────────────────────────
            const handleSelect = useCallback(id => {
                setActiveId(id);
                const tab = tabs.find(t => t.id === id);
                if (tab) {
                    setFileName(tab.name.replace(/\.[^.]+$/, ''));
                    const ext = tab.name.match(/\.[^.]+$/);
                    setFileExt(ext ? ext[0] : '.txt');
                }
                focusWindow(id);
            }, [tabs, focusWindow]);

            const handleClose = useCallback(id => {
                setWindows(prev => prev.filter(w => w.tabId !== id));
                setTabs(prev => {
                    if (prev.length <= 1) return prev;
                    const idx = prev.findIndex(t => t.id === id);
                    const next = prev.filter(t => t.id !== id);
                    if (id === activeId) {
                        const newActive = next[Math.min(idx, next.length - 1)];
                        setActiveId(newActive.id);
                        setFileName(newActive.name.replace(/\.[^.]+$/, ''));
                    }
                    return next;
                });
            }, [activeId]);

            const handleAdd = useCallback(() => {
                const tab = createTab('Untitled');
                setTabs(prev => [...prev, tab]);
                setActiveId(tab.id);
                setFileName('Untitled');
                setFileExt('.txt');
                const pos = getWindowDefaultPos();
                setWindows(prev => [...prev, {
                    tabId: tab.id,
                    x: pos.x, y: pos.y, w: 650, h: 450,
                    minimized: false, maximized: false,
                }]);
                setNextZIndex(z => z + 1);
            }, [getWindowDefaultPos]);

            // ── Window actions ───────────────────────
            const toggleMinimize = useCallback((tabId, e) => {
                if (e) e.stopPropagation();
                setWindows(prev => prev.map(w =>
                    w.tabId === tabId ? { ...w, minimized: !w.minimized } : w
                ));
            }, []);

            const toggleMaximize = useCallback((tabId, e) => {
                if (e) e.stopPropagation();
                setWindows(prev => prev.map(w =>
                    w.tabId === tabId ? { ...w, maximized: !w.maximized } : w
                ));
            }, []);

            const closeWindow = useCallback((tabId, e) => {
                if (e) e.stopPropagation();
                handleClose(tabId);
            }, [handleClose]);

            // Save restored position when un-maximizing

            // ── Content change ─────────────────────────
            const handleContentChange = useCallback((tabId, ops, text) => {
                setTabs(prev => prev.map(t =>
                    t.id === tabId ? { ...t, content: ops, text } : t
                ));
            }, []);

            // ── File operations ────────────────────────
            const saveFile = useCallback(() => {
                const tab = tabs.find(t => t.id === activeId);
                if (!tab) return;
                const name = fileName + fileExt;
                const text = tab.text || '';
                const blob = new Blob([text], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name;
                a.click();
                setTabs(prev => prev.map(t =>
                    t.id === activeId ? { ...t, name } : t
                ));
            }, [tabs, activeId, fileName, fileExt]);

            const openFile = useCallback(() => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.txt,.js,.html,.css,.json,.md,.py,.ts,.jsx,.tsx';
                input.onchange = e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = ev => {
                        const tab = createTab(file.name, '');
                        tab.text = ev.target.result;
                        setTabs(prev => [...prev, tab]);
                        setActiveId(tab.id);
                        setWindows(prev => {
                            const count = prev.length;
                            return [...prev, {
                                tabId: tab.id,
                                x: 40 + (count % 5) * 30, y: 20 + (count % 5) * 30,
                                w: 650, h: 450, minimized: false, maximized: false,
                            }];
                        });
                        setFileName(file.name.replace(/\.[^.]+$/, ''));
                        const ext = file.name.match(/\.[^.]+$/);
                        setFileExt(ext ? ext[0] : '.txt');
                    };
                    reader.onerror = () => console.error(`Failed to read file: ${file.name}`);
                    reader.readAsText(file);
                };
                input.click();
            }, []);

            const renameTab = useCallback(() => {
                const name = fileName + fileExt;
                setTabs(prev => prev.map(t =>
                    t.id === activeId ? { ...t, name } : t
                ));
            }, [activeId, fileName, fileExt]);

            // ── Keyboard shortcuts ─────────────────────
            useEffect(() => {
                const handler = e => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'o') { e.preventDefault(); openFile(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); handleAdd(); }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [saveFile, openFile, handleAdd]);

            return (
                <>
                    <TabBar
                        tabs={tabs}
                        activeId={activeId}
                        onSelect={handleSelect}
                        onClose={handleClose}
                        onAdd={handleAdd}
                    />

                    <div className="toolbar">
                        {/* Row 1: File ops, Window */}
                        <div className="toolbar-row">
                            <div className="toolbar-group">
                                <button onClick={handleAdd}>New</button>
                                <button onClick={openFile}>Open</button>
                                <button className="primary" onClick={saveFile}>Save</button>
                            </div>
                            <div className="toolbar-sep" />
                            <div className="toolbar-group">
                                <input
                                    type="text"
                                    value={fileName}
                                    onChange={e => setFileName(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && renameTab()}
                                    placeholder="File name"
                                />
                                <select value={fileExt} onChange={e => setFileExt(e.target.value)}>
                                    <option value=".txt">.txt</option>
                                    <option value=".js">.js</option>
                                    <option value=".html">.html</option>
                                    <option value=".css">.css</option>
                                    <option value=".json">.json</option>
                                    <option value=".md">.md</option>
                                    <option value=".py">.py</option>
                                </select>
                                <button onClick={renameTab}>Rename</button>
                            </div>
                            <div className="toolbar-sep" />
                            <div className="toolbar-group">
                                <button onClick={() => {
                                    const existing = windows.find(w => w.tabId === activeId);
                                    if (existing) return;
                                    setWindows(prev => [...prev, {
                                        tabId: activeId,
                                        x: 40 + (prev.length % 5) * 30, y: 20 + (prev.length % 5) * 30,
                                        w: 650, h: 450, minimized: false, maximized: false,
                                    }]);
                                }} title="Open active tab in new window">
                                    Window
                                </button>
                            </div>
                        </div>

                        {/* Row 2: FX toggle, Effect type, Direction */}
                        <div className="toolbar-row">
                            <div className="toolbar-group">
                                <button
                                    onClick={() => setAnimEnabled(e => !e)}
                                    style={{
                                        background: animEnabled ? 'var(--accent)' : 'var(--bg-surface-alt)',
                                        color: animEnabled ? '#fff' : 'var(--text-muted)',
                                        fontWeight: 600,
                                    }}
                                    title="Toggle letter animation"
                                >
                                    {animEnabled ? 'FX ON' : 'FX OFF'}
                                </button>
                            </div>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Effect</label>
                                <select
                                    value={animEffect}
                                    onChange={e => setAnimEffect(e.target.value)}
                                    disabled={!animEnabled}
                                    style={{fontSize: '12px', background: 'var(--bg-surface-alt)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: '4px', padding: '2px 4px'}}
                                >
                                    <option value="flyIn">Fly In</option>
                                    <option value="digitize">Digitize</option>
                                    <option value="pop">Pop</option>
                                    <option value="slam">Slam</option>
                                    <option value="spin">Spin</option>
                                    <option value="wave">Wave</option>
                                    <option value="typewriter">Typewriter</option>
                                    <option value="glitch">Glitch</option>
                                    <option value="inkBlot">Ink Blot</option>
                                    <option value="magnetic">Magnetic</option>
                                    <option value="xirtam">XIRTAM</option>
                                </select>
                            </div>
                            {animEffect === 'flyIn' && (
                                <div className="toolbar-group">
                                    <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Direction</label>
                                    <select
                                        value={flyInDirection}
                                        onChange={e => setFlyInDirection(e.target.value)}
                                        disabled={!animEnabled}
                                        style={{fontSize: '12px', background: 'var(--bg-surface-alt)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: '4px', padding: '2px 4px'}}
                                    >
                                        <option value="random">Random</option>
                                        <option value="top">Top</option>
                                        <option value="bottom">Bottom</option>
                                        <option value="left">Left</option>
                                        <option value="right">Right</option>
                                        <option value="diagonal">Diagonal</option>
                                    </select>
                                </div>
                            )}
                        </div>

                        {/* Row 3: Generative settings */}
                        <div className="toolbar-row">
                            <label style={{fontSize: '11px', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.5px'}}>Generative</label>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Speed</label>
                                <input
                                    type="number" min={50} max={10000} step={10}
                                    value={animDuration}
                                    onChange={e => setAnimDuration(Number(e.target.value))}
                                    disabled={!animEnabled}
                                    style={{width: '70px'}}
                                />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '35px'}}>{animDuration}ms</span>
                            </div>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Size</label>
                                <input
                                    type="number" min={0} max={1000} step={1}
                                    value={animOffset}
                                    onChange={e => setAnimOffset(Number(e.target.value))}
                                    disabled={!animEnabled}
                                    style={{width: '60px'}}
                                />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '20px'}}>{animOffset}</span>
                            </div>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Intensity</label>
                                <input
                                    type="number" min={0} max={10} step={0.05}
                                    value={intensity.toFixed(2)}
                                    onChange={e => setIntensity(parseFloat(e.target.value))}
                                    disabled={!animEnabled}
                                    style={{width: '65px'}}
                                />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '35px'}}>{intensity.toFixed(2)}x</span>
                            </div>
                        </div>

                        {/* Row 4: Delete FX selector */}
                        <div className="toolbar-row">
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Delete FX</label>
                                <select
                                    value={deleteEffect}
                                    onChange={e => setDeleteEffect(e.target.value)}
                                    disabled={!animEnabled}
                                    style={{fontSize: '12px', background: 'var(--bg-surface-alt)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: '4px', padding: '2px 4px'}}
                                >
                                    <option value="destroy">Explode</option>
                                    <option value="evaporate">Evaporate</option>
                                    <option value="cut">Slice</option>
                                    <option value="shatter">Shatter</option>
                                    <option value="confetti">Confetti</option>
                                    <option value="blackHole">Black Hole</option>
                                </select>
                            </div>
                        </div>

                        {/* Row 5: Destructive settings */}
                        <div className="toolbar-row">
                            <label style={{fontSize: '11px', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.5px'}}>Destructive</label>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Speed</label>
                                <input
                                    type="number" min={50} max={10000} step={10}
                                    value={delDuration}
                                    onChange={e => setDelDuration(Number(e.target.value))}
                                    disabled={!animEnabled}
                                    style={{width: '70px'}}
                                />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '35px'}}>{delDuration}ms</span>
                            </div>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Size</label>
                                <input
                                    type="number" min={0} max={1000} step={1}
                                    value={delOffset}
                                    onChange={e => setDelOffset(Number(e.target.value))}
                                    disabled={!animEnabled}
                                    style={{width: '60px'}}
                                />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '20px'}}>{delOffset}</span>
                            </div>
                            <div className="toolbar-group">
                                <label style={{fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap'}}>Intensity</label>
                                <input
                                    type="number" min={0} max={10} step={0.05}
                                    value={delIntensity.toFixed(2)}
                                    onChange={e => setDelIntensity(parseFloat(e.target.value))}
                                    disabled={!animEnabled}
                                    style={{width: '65px'}}
                                />
                                <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '35px'}}>{delIntensity.toFixed(2)}x</span>
                            </div>
                        </div>

                        {/* Row 4: Misc controls */}
                        <div className="toolbar-row">
                            <div className="toolbar-group">
                                <button onClick={() => setRowGlowScope(s => s === 'paragraph' ? 'line' : 'paragraph')} title={rowGlowScope === 'paragraph' ? 'Enter glows paragraph above' : 'Enter glows single line above'}>
                                    {rowGlowScope === 'paragraph' ? '¶ Glow' : '▭ Glow'}
                                </button>
                            </div>
                            <div className="toolbar-sep" />
                            <div className="toolbar-group">
                                <button onClick={() => setIsDark(d => !d)}>
                                    {isDark ? 'Dark' : 'Light'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div ref={workspaceRef} className="workspace-area" onClick={() => {}}>
                        {windows.length === 0 && (
                            <div className="workspace-empty">No open documents &middot; Click New or Open to start</div>
                        )}
                        {windows.map(win => {
                            const tab = tabs.find(t => t.id === win.tabId);
                            if (!tab) return null;
                            const isFocused = activeId === win.tabId;
                            const zIdx = isFocused ? nextZIndex : 10;

                            return (
                                <FloatWindow
                                    key={win.tabId}
                                    tab={tab}
                                    x={win.x} y={win.y} w={win.w} h={win.h}
                                    minimized={win.minimized} maximized={win.maximized}
                                    focused={isFocused}
                                    zIndex={zIdx}
                                    onFocus={() => focusWindow(win.tabId)}
                                    onMinimize={() => toggleMinimize(win.tabId)}
                                    onMaximize={() => toggleMaximize(win.tabId)}
                                    onClose={() => closeWindow(win.tabId)}
                                    onDrag={(dx, dy) => {
                                        setWindows(prev => prev.map(w =>
                                            w.tabId === win.tabId ? { ...w, x: w.x + dx, y: w.y + dy } : w
                                        ));
                                    }}
                                    onResize={(dw, dh) => {
                                        setWindows(prev => prev.map(w => {
                                            if (w.tabId !== win.tabId) return w;
                                            return { ...w, w: Math.max(320, w.w + dw), h: Math.max(200, w.h + dh) };
                                        }));
                                    }}
                                    onContentChange={handleContentChange}
                                    animDuration={animDuration}
                                    animEnabled={animEnabled}
                                    animEffect={animEffect}
                                    flyInDirection={flyInDirection}
                                    animOffset={animOffset}
                                    deleteEffect={deleteEffect}
                                    intensity={intensity}
                                    delDuration={delDuration}
                                    delOffset={delOffset}
                                    delIntensity={delIntensity}
                                    rowGlowScope={rowGlowScope}
                                />
                            );
                        })}
                    </div>

                    <div className="status-bar">
                        <span>{windows.length} window{windows.length > 1 ? 's' : ''} &middot; {tabs.length} tab{tabs.length > 1 ? 's' : ''}</span>
                        <span>{totalWords} words total</span>
                        <span>Ctrl+S save &middot; Ctrl+O open &middot; Ctrl+N new</span>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
